// The frame sits still: no beat bounce; only the drop moves the picture. All prices, trades and stats are SIMULATED. Every frame is a pure function of t.
const q=new URLSearchParams(location.search),W=1080,H=1350,FPS=60,BEAT=0.4968409906,D=96*BEAT,TAU=Math.PI*2;
const cv=document.getElementById('c');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
const buf=document.createElement('canvas');buf.width=W;buf.height=H;const x=buf.getContext('2d');
const small=document.createElement('canvas');small.width=W/4;small.height=H/4;const sx4=small.getContext('2d');
const G='#1FDB8A',GL='#7CFFC4',HEAD='#E3FFF1',MUTE='#86C9A9',DIM='#2F6B53',BG0='#000A07',BG1='#02201A',RED='#FF5A6A',AMB='#FFC857';

function T(s,px,py,sz,wt,fam,col,al,ls,glow){x.save();x.font=`${wt} ${sz}px ${fam}`;x.fillStyle=col;x.textAlign=al||'left';x.textBaseline='alphabetic';if(x.letterSpacing!==undefined)x.letterSpacing=(ls||0)+'px';if(glow){x.shadowColor=glow;x.shadowBlur=sz*.5;}x.fillText(s,px,py);x.restore();}
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r);}

// ---------- the setup (owner's journal fields; values chosen for this example) ----------

const NC=201,C=[];{let prev=21505;for(let i=0;i<NC;i++){let k=0;while(KP[k+1][0]<i)k++;const a=KP[k],b=KP[Math.min(k+1,KP.length-1)],u=b[0]===a[0]?0:(i-a[0])/(b[0]-a[0]);let c=lerp(a[1],b[1],u)+(hh(3,i)-.5)*3.2;const o=prev,hi=Math.max(o,c)+hh(4,i)*2.2,lo=Math.min(o,c)-hh(5,i)*2.2;C.push({o,h:hi,l:lo,c});prev=c;}
 const S=(i,o,h,l,c)=>{C[i]={o,h,l,c};};S(172,21463,21464.5,SWL,21460);S(173,21460,21466,21459.5,21465.5);S(175,21469,BISI[0],21468,21474);S(176,21474,21491,21473,21490);S(177,21490,21499,BISI[1],21497);S(181,21518,LEG[1],21516,21519);S(192,21483,21484.5,21479,21481.5);S(140,21470,21471,21468,21469.5);
 for(let i=1;i<NC;i++){if(![173,176,177,181,192].includes(i)){C[i].o=C[i-1].c;C[i].h=Math.max(C[i].h,C[i].o,C[i].c);C[i].l=Math.min(C[i].l,C[i].o,C[i].c);}}
 C[172].l=SWL;for(let i=0;i<NC;i++){if(i!==172&&C[i].l<SWL+.5)C[i].l=SWL+.5+hh(8,i);if(C[i].h>PDH-8)C[i].h=PDH-8;}}
const tm=i=>{const m=420+i;return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;};

// ---------- shots (beats) ----------
const SH=[
 {k:'overview',b:0, cam:[100,21500,236,128],tag:'CUTAWAY · REAR VIEW',      title:'THE SENTINEL',  val:'Core cutaway',      pts:['One NQ setup, read from the journal','10 fields, one exact order']},
 {k:'news',    b:5, cam:[92,21508,62,62],   tag:'CLOSE-UP · PULSE CORE',   title:'NEWS',          val:'High Impact',           pts:['08:30 release on the calendar','Volatility is the opportunity']},
 {k:'flow',    b:10, cam:[120,21500,170,110],tag:'CLOSE-UP · CURRENT',title:'ORDERFLOW',   val:'Bullish',               pts:['Higher timeframe pushing up','Buyers in control']},

 {k:'sweep',   b:20,cam:[172,21461,22,20],  tag:'CLOSE-UP · MEMBRANE',title:'LIQUIDITY SWEEP',val:'Previous Daily Low',  pts:['PDL '+fmt(PDL)+' taken at 09:52','Low printed at '+fmt(SWL)]},
 {k:'poi',     b:25,cam:[176,21483,12,30],  tag:'CLOSE-UP · IMBALANCE',    title:'POINT OF INTEREST',val:'BISI',               pts:['Buy-side imbalance, sell-side inefficiency','Gap '+fmt(BISI[0])+' – '+fmt(BISI[1])]},

 {k:'end',     b:63}];
const FIELDS=SH.slice(1,11),END=SH.pop();SH[11].b=55;
FIELDS.slice().reverse().forEach((f,k)=>SH.push(Object.assign({},f,{b:62+k*2,recap:k+1,tag:'RECAP · '+f.tag.split('· ')[1]})));
SH.push(Object.assign({},SH[0],{b:82,recap:11,tag:'RECAP · REAR VIEW'}));END.b=87;SH.push(END);
SH.forEach((s,i)=>{s.t0=s.b*BEAT;s.t1=(i<SH.length-1?SH[i+1].b:96)*BEAT;});
const FILL=59*BEAT,EI=SH.length-1;
const shotAt=t=>{let i=0;SH.forEach((s,k)=>{if(t>=s.t0)i=k;});return i;};
const bump=t=>Math.exp(-mod(t,BEAT)/BEAT*6);

// ---------- camera ----------
const VX=24,VY=250,VW=1032,VH=670;
function camAt(t){const i=Math.min(shotAt(t),11),s=SH[i],u=clamp((t-s.t0)/(s.t1-s.t0),0,1),push=1+.12*eo(u),settle=1+.14*Math.exp(-(t-s.t0)*9);
 let [cx,cy,w,h]=s.cam;const z=push*settle;return {cx,cy,w:w/z,h:h/z};}
function W2S(cam,i,p){return [VX+VW/2+(i-cam.cx)*VW/cam.w,VY+VH/2-(p-cam.cy)*VH/cam.h];}

// ---------- background layers ----------
const GLY='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワ0123456789';
function rain(t,X0,Y0,WW,HH,cols,fs,alpha){x.save();x.beginPath();x.rect(X0,Y0,WW,HH);x.clip();x.font=`bold ${fs}px ${JP}`;x.textAlign='center';
 for(let k=0;k<cols;k++){const px=X0+(k+.5)*WW/cols,len=6+Math.floor(hh(12,k)*14),sp=90+hh(13,k)*190,span=HH+len*fs+200,head=Y0+mod(hh(14,k)*span+t*sp,span)-100;

function bokeh(t,X0,Y0,WW,HH){for(let i=0;i<26;i++){const px=X0+mod(hh(20,i)*WW+t*(8+hh(21,i)*16)*(hh(22,i)<.5?1:-1),WW),py=Y0+mod(hh(23,i)*HH-t*(6+hh(24,i)*10),HH),r=12+hh(25,i)*40,g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,`rgba(124,255,196,${.05+.06*hh(26,i)})`);g.addColorStop(1,'rgba(124,255,196,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,TAU);x.fill();}}

// ---------- viewport: the world chart and its overlays ----------
function hline(cam,p,col,lw,dash,label,al){const [,y]=W2S(cam,0,p);if(y<VY-4||y>VY+VH+4)return;x.save();x.strokeStyle=col;x.lineWidth=lw;x.setLineDash(dash||[]);x.shadowColor=col;x.shadowBlur=10;x.beginPath();x.moveTo(VX,y);x.lineTo(VX+VW,y);x.stroke();x.restore();if(label){x.save();x.font=`700 17px ${MONO}`;const w=x.measureText(label).width+16;x.fillStyle='rgba(0,10,7,.85)';rr(VX+VW-w-150,y-14,w,28,6);x.fill();x.strokeStyle=col;x.lineWidth=1.5;x.stroke();T(label,VX+VW-150-w/2,y+6,17,700,MONO,col,'center');x.restore();}}

 for(let i=i0;i<=i1;i++){if(dimAfter!==undefined&&i>dimAfter)continue;const k=C[i],[cx]=W2S(cam,i,0),[,yo]=W2S(cam,0,k.o),[,yc]=W2S(cam,0,k.c),[,yh]=W2S(cam,0,k.h),[,yl]=W2S(cam,0,k.l),up=k.c>=k.o;
  x.strokeStyle=up?G:'rgba(31,219,138,.55)';x.lineWidth=Math.max(1,ppc*.08);x.beginPath();x.moveTo(cx,yh);x.lineTo(cx,yl);x.stroke();
  const top=Math.min(yo,yc),hgt=Math.max(1.5,Math.abs(yc-yo));if(up){const g=x.createLinearGradient(0,top,0,top+hgt);g.addColorStop(0,GL);g.addColorStop(1,'#0E8F5A');x.fillStyle=g;x.fillRect(cx-bw/2,top,bw,hgt);}else{x.fillStyle='rgba(2,32,26,.95)';x.fillRect(cx-bw/2,top,bw,hgt);x.strokeStyle='rgba(31,219,138,.7)';x.lineWidth=Math.max(1,ppc*.06);x.strokeRect(cx-bw/2,top,bw,hgt);}}}
function axes(cam){x.save();x.strokeStyle='rgba(31,219,138,.08)';x.lineWidth=1;const step=cam.h>60?10:(cam.h>25?5:1);for(let p=Math.ceil((cam.cy-cam.h/2)/step)*step;p<cam.cy+cam.h/2;p+=step){const [,y]=W2S(cam,0,p);x.beginPath();x.moveTo(VX,y);x.lineTo(VX+VW,y);x.stroke();if(p%(step*2)===0)T(fmt(p),VX+10,y-5,13,400,MONO,'rgba(134,201,169,.55)');}
 const ts=cam.w>100?30:(cam.w>40?10:(cam.w>15?5:1));for(let i=Math.ceil((cam.cx-cam.w/2)/ts)*ts;i<cam.cx+cam.w/2;i+=ts){const [px]=W2S(cam,i,0);x.beginPath();x.moveTo(px,VY);x.lineTo(px,VY+VH);x.stroke();if(i>=0&&i<NC)T(tm(i),px+4,VY+VH-10,13,400,MONO,'rgba(134,201,169,.55)');}x.restore();}
function pill(px,py,s,col,bg){x.save();x.font=`700 16px ${MONO}`;const w=x.measureText(s).width+22;x.fillStyle=bg||'rgba(0,10,7,.8)';rr(px,py,w,30,15);x.fill();x.strokeStyle=col||'rgba(31,219,138,.5)';x.lineWidth=1.2;x.stroke();T(s,px+11,py+21,16,700,MONO,col||G,'left',1);x.restore();return w;}
function overlays(cam,t,si,lt){const s=SH[si].k,ap=eo(lt/.45);
 // always: PDH / PDL
 hline(cam,PDH,'rgba(124,255,196,.55)',1.5,[8,6],si>=3?'PDH '+fmt(PDH):null);hline(cam,PDL,'rgba(124,255,196,.45)',1.5,[8,6],si>=4?'PDL '+fmt(PDL):null);
 if(si>=1){const [nx]=W2S(cam,90,0);if(nx>VX&&nx<VX+VW){x.save();x.strokeStyle=AMB;x.globalAlpha=si===1?1:.45;x.lineWidth=2;x.setLineDash([3,6]);x.beginPath();x.moveTo(nx,VY);x.lineTo(nx,VY+VH);x.stroke();x.restore();if(si===1){for(let r=0;r<3;r++){const e=mod(lt*.9+r/3,1);x.strokeStyle=`rgba(255,200,87,${.6*(1-e)})`;x.lineWidth=2;const [,ny]=W2S(cam,91,21527);x.beginPath();x.arc(nx,ny,10+e*120,0,TAU);x.stroke();}pill(nx+14,VY+60,'HIGH IMPACT · 08:30',AMB);}}}
 if(s==='flow'){for(let k=0;k<70;k++){const u=mod(hh(30,k)+lt*.35,1),i=lerp(10,190,u),p=lerp(21488,21512,u)+(hh(31,k)-.5)*30+Math.sin(u*9+k)*3,[px,py]=W2S(cam,i,p);x.fillStyle=`rgba(124,255,196,${.55*Math.sin(u*Math.PI)})`;x.beginPath();x.arc(px,py,2.5,0,TAU);x.fill();}
  x.save();x.strokeStyle=GL;x.lineWidth=5;x.shadowColor=G;x.shadowBlur=20;x.globalAlpha=ap;const a=W2S(cam,20,21482),b=W2S(cam,lerp(20,195,ap),lerp(21482,21515,ap));x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();x.restore();}
 if(s==='dol'||s==='target'){const [,y]=W2S(cam,0,PDH);for(let k=0;k<40;k++){const px=VX+hh(40,k)*VW,py=y-8-hh(41,k)*60-Math.sin(lt*2+k)*4;x.fillStyle=`rgba(255,200,87,${.25+.4*hh(42,k)})`;x.beginPath();x.arc(px,py,1.6+hh(43,k)*2.4,0,TAU);x.fill();}T('BUY-SIDE LIQUIDITY',VX+30,y-80,16,700,MONO,AMB,'left',3);
  const a=W2S(cam,184,21500),b=W2S(cam,184,lerp(21500,PDH-3,ap));x.save();x.strokeStyle=GL;x.lineWidth=3;x.setLineDash([2,8]);x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();x.restore();}
 if(si>=4){const [px,py]=W2S(cam,172,SWL);if(s==='sweep'){for(let k=0;k<30;k++){const e=clamp(lt*1.4-hh(50,k)*.3,0,1),ang=hh(51,k)*TAU,r=e*90*(.4+hh(52,k));x.fillStyle=`rgba(227,255,241,${.8*(1-e)})`;x.beginPath();x.arc(px+Math.cos(ang)*r,py+Math.sin(ang)*r*.6,2,0,TAU);x.fill();}
   x.save();x.strokeStyle=GL;x.lineWidth=3;x.shadowColor=G;x.shadowBlur=20;x.beginPath();x.arc(px,py,26,0,TAU);x.stroke();x.restore();pill(px-300,py+30,'SWEPT · '+fmt(SWL),HEAD);}}
 if(si>=5){const a=W2S(cam,175.5,BISI[1]),b=W2S(cam,177.5,BISI[0]);const w=(VX+VW-a[0]);x.save();x.globalAlpha=s==='poi'?1:.6;const g=x.createLinearGradient(a[0],0,a[0]+w,0);g.addColorStop(0,'rgba(31,219,138,.32)');g.addColorStop(1,'rgba(31,219,138,0)');x.fillStyle=g;x.fillRect(a[0],a[1],w*(s==='poi'?ap:1),b[1]-a[1]);x.strokeStyle=GL;x.lineWidth=1.5;x.strokeRect(a[0],a[1],w*(s==='poi'?ap:1),b[1]-a[1]);x.restore();if(s==='poi')pill(a[0]+12,a[1]-40,'BISI '+fmt(BISI[0])+' – '+fmt(BISI[1]),HEAD);}
 if(si>=6){const a=W2S(cam,165,0),b=W2S(cam,195,0);x.save();x.fillStyle=`rgba(124,255,196,${s==='toi'?.10:.05})`;x.fillRect(a[0],VY,b[0]-a[0],VH);x.strokeStyle=`rgba(124,255,196,${s==='toi'?.6:.25})`;x.setLineDash([4,6]);x.lineWidth=1.5;x.beginPath();x.moveTo(a[0],VY);x.lineTo(a[0],VY+VH);x.moveTo(b[0],VY);x.lineTo(b[0],VY+VH);x.stroke();x.restore();if(s==='toi'){pill(a[0]+12,VY+60,'TOI 09:45 – 10:15',HEAD);}}
 if(s==='smt'){// NQ lows vs ES lows (simulated), inset
  const ix=VX+VW-380,iy=VY+90,iw=350,ih=240;x.fillStyle='rgba(0,10,7,.88)';rr(ix,iy,iw,ih,12);x.fill();x.strokeStyle='rgba(31,219,138,.5)';x.lineWidth=1.2;x.stroke();T('SMT · 90-MINUTE',ix+16,iy+28,15,700,MONO,G,'left',2);
  const nq=[.55,.2,.5,.85,.3,.6,.95,.45,.7,.4],es=[.5,.25,.45,.8,.35,.55,.75,.4,.6,.3];// lower = lower price; 4th/7th points are the two lows (drawn inverted)
  const P=(arr,yo,col,lab,ll)=>{x.strokeStyle=col;x.lineWidth=2.4;x.beginPath();arr.forEach((v,k)=>{const px=ix+20+k*(iw-40)/9,py=iy+yo+v*60;k?x.lineTo(px,py):x.moveTo(px,py);});x.stroke();T(lab,ix+iw-16,iy+yo-6,13,700,MONO,col,'right');
   const l1=[ix+20+3*(iw-40)/9,iy+yo+arr[3]*60],l2=[ix+20+6*(iw-40)/9,iy+yo+arr[6]*60];x.save();x.globalAlpha=ap;x.strokeStyle=col;x.setLineDash([3,4]);x.beginPath();x.moveTo(l1[0],l1[1]);x.lineTo(l2[0],l2[1]);x.stroke();x.restore();T(ll,l2[0]+8,l2[1]+16,12,700,MONO,col);};
  P(nq,62,GL,'NQ','lower low');P(es,150,AMB,'ES','higher low');}
 if(s==='ote'||si>=8){const [,yA]=W2S(cam,0,LEG[0]),[,yB]=W2S(cam,0,LEG[1]),lv=[[.62,'62%'],[.705,'70.5%'],[.79,'79%']];if(s==='ote'){x.save();x.globalAlpha=ap;lv.forEach(([f,l])=>{const p=LEG[1]-(LEG[1]-LEG[0])*f,[,y]=W2S(cam,0,p);x.strokeStyle='rgba(124,255,196,.6)';x.setLineDash([6,6]);x.lineWidth=1.5;x.beginPath();x.moveTo(VX+VW*.35,y);x.lineTo(VX+VW,y);x.stroke();T(l+' · '+fmt(p),VX+VW*.35+8,y-6,14,700,MONO,MUTE);});x.restore();}
  hline(cam,ENTRY,HEAD,2.5,[],s==='ote'||si>=8?'ENTRY '+fmt(ENTRY):null);}
 if(si>=9){hline(cam,STOP,RED,2,[],'STOP '+fmt(STOP));if(s==='inval'){const [px,py]=W2S(cam,172,SWL);x.save();x.strokeStyle=RED;x.lineWidth=2.5;x.beginPath();x.arc(px,py,20,0,TAU);x.stroke();x.restore();}}
 if(si>=10){hline(cam,TGT,GL,2.5,[],'TARGET 2.9R · '+fmt(TGT));}}
function ticket(t){const u=sst(SH[11].t0+.2,SH[11].t0+.7,t);if(u<=0)return;const w=520,h=250,px=VX+VW-w-40,py=VY+VH-h-40+(1-u)*20;x.save();x.globalAlpha=u;x.fillStyle='rgba(0,10,7,.92)';rr(px,py,w,h,14);x.fill();x.strokeStyle=G;x.lineWidth=2;x.shadowColor=G;x.shadowBlur=18;x.stroke();x.shadowBlur=0;
