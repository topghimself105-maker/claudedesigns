<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>F369 engine</title>
<style>html,body{margin:0;background:#040907;height:100%}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script src="sim.js"></script>
<script>
// F369 engine: how the engine reads the market. 45 s, locked to a 128 bpm grid (1 bar = 1.875 s, drop at bar 15 = 28.125 s).
// ?layout=9x16|4x5|16x9  ?reduced=1  ?t=12  ?play=1   Every frame is a pure function of t.
const q=new URLSearchParams(location.search),LAYOUT=q.get('layout')||'9x16',REDUCED=q.get('reduced')==='1';
const SIZES={'9x16':[1080,1920],'4x5':[1080,1350],'16x9':[1920,1080]},[W,H]=SIZES[LAYOUT],TAU=Math.PI*2;
const cv=document.getElementById('c');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
const D=45,FPS=60,BEAT=60/128,BAR=BEAT*4;
const K={bg:'#040907',panel:'#07100c',line:'#15251d',hair:'#1c3027',grid:'#2a4337',dim:'#58786a',mu:'#8fb5a4',tx:'#d8efe6',w:'#f2fbf7',mint:'#66f2c0',up:'#3ea87c',dn:'#c25a50',
  ag:{GENERAL:'#7bd96f',LIVE:'#e5625a',BACKTEST:'#5b8cff',RESEARCH:'#a98bff',DATA:'#2fcf9a'}};
const MONO='"DejaVu Sans Mono", monospace',SANS='"Inter", sans-serif',LIGHT='"Inter Display", "Inter", sans-serif';
const mod=(x,m)=>((x%m)+m)%m,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,sst=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function hash(a,b){let x=(Math.imul(a|0,374761393)+Math.imul((b|0)+7919,668265263))|0;x=Math.imul(x^(x>>>13),1274126177);x^=x>>>16;return (x>>>0)/4294967296;}
const R=(a,b)=>hash(a,b),hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;};
const fmt=n=>Math.round(n).toLocaleString('en-US');

// ---------- data ----------
const C=SIM3.candles(),DT=SIM3.detect(C),SA=DT.setups[0],SB=DT.setups[1],MATH=DT.math,N=SIM3.N;
const rad=p=>270+(p-21360)*.82,ang=i=>-Math.PI/2+(i+.5)*TAU/N,POS=(i,p)=>[rad(p)*Math.cos(ang(i)),rad(p)*Math.sin(ang(i))];
const hmm=i=>SIM3.hm(i);

// ---------- timeline (all on the beat grid) ----------
const bt=b=>b*BEAT,bar=k=>k*BAR;
const PLATES=[[0,bar(5),'THE DIAL','DIAL'],[bar(5),bar(11),'THE LEDGER','LEDGER'],[bar(11),bar(20),'THE CORE','CORE'],[bar(20),D,'THE ANSWER','ANSWER']];
const T_WIN=bar(11),T_SWEEP=bt(50),T_CSD=bt(53),T_DISP=bt(55),T_MSS=bt(55.5),T_FVG=bt(57),T_ARM=bt(59),T_DROP=bar(15),T_FILL=bt(62),T_TP=bt(70),T_TURN=bt(70.2),T_BSWEEP=bt(75),T_BCSD=bt(77),T_BMSS=bt(78),T_SKIP=bt(79.5),T_END=bar(22.5);
const STMT=[
 [.3,bar(3),'YOUR QUESTION',['Bad luck, or liquidity?']],
 [bar(3),bar(5),'WHERE STOPS REST',['Orders rest above highs','and below lows.']],
 [bar(5),bar(8),'THE TEN STEPS',['Ten checks.','No discretion.']],
 [bar(8),bar(11),'PD ARRAYS',['Buy from discount.','Sell from premium.']],
 [bar(11),bar(15),'ONE ENGINE · FIVE AGENTS',['The agents run','the chain live.']],
 [bar(15),T_TURN,'ORDER PLACED',['Stop beyond the sweep.','Target 5R.']],
 [T_TURN,bar(20),'SAME SWEEP · OUTSIDE THE WINDOW',['The algo skips it.']],
 [bar(20),T_END,'THE ANSWER',['Not luck.','A rule chain.']]];
// ledger: ten steps; pass time in the live run (A) and in the skip run (B)
const STEPS=[['F369 TIME','90m cycle valid'],['DEALING RANGE','swing high to low · 50% = EQ'],['POOLS','BSL / SSL marked'],['SSL SWEPT','wick through, close back inside'],['CSD','change in state of delivery'],['DISPLACEMENT','body ≥ 1.8× average'],['MSS','close through swing high'],['DISCOUNT PD ARRAY','FVG / OB / breaker below EQ'],['ORDER','0.5% risk · stop beyond sweep'],['TARGET','opposing BSL · 5 RR']];
const PASS_A=[T_WIN,T_WIN+BEAT,T_WIN+BEAT*1.5,T_SWEEP,T_CSD,T_DISP,T_MSS,T_FVG,T_DROP,T_DROP+BEAT*.5];
const PASS_B=[null,T_TURN+BEAT*.5,T_TURN+BEAT*1.0,T_BSWEEP,T_BCSD,T_BCSD+BEAT*.5,T_BMSS,T_BMSS+BEAT,null,null];
const P2_CHECK=i=>bar(5)+BEAT*(2+i*1.2);            // dry pass in the ledger plate, one check per beat or so
const plateAt=t=>{for(let i=3;i>=0;i--)if(t>=PLATES[i][0])return i;return 0;};
const kick=t=>{const b=t/BEAT;return Math.exp(-mod(b,1)*5.5);};
const energy=t=>t<bar(6)?.25:t<T_DROP-.5?.55:t<T_DROP?.2:1;   // how loud the track is (low band): build, silence before the drop, full

// ---------- layout ----------
const LY=(()=>{if(LAYOUT==='9x16')return{scene:{x:0,y:132,w:1080,h:1236},stmt:{lx:44,ly:1414,y:1482,fs:66,lh:70},lower:{x:15,y:1606,w:1050,h:282},grid:[4,2],disc:1908,bar:{x:40,y:46}};
 if(LAYOUT==='4x5')return{scene:{x:0,y:116,w:1080,h:760},stmt:{lx:44,ly:908,y:960,fs:48,lh:50},lower:{x:15,y:1054,w:1050,h:262},grid:[4,2],disc:1338,bar:{x:40,y:46}};
 return{scene:{x:0,y:104,w:1250,h:830},stmt:{lx:50,ly:962,y:1010,fs:44,lh:48},lower:{x:1262,y:116,w:643,h:930},grid:[2,4],disc:1066,bar:{x:50,y:46}};})();
const SC=LY.scene,SCX=SC.x+SC.w/2,SCY=SC.y+SC.h/2,DR=655,SF=Math.min(SC.w,SC.h)/(2*DR)*1.04;
const panelRect=i=>{const [cols,rows]=LY.grid,L=LY.lower,g=8,w=(L.w-g*(cols-1))/cols,h=(L.h-g*(rows-1))/rows;return{x:L.x+(i%cols)*(w+g),y:L.y+Math.floor(i/cols)*(h+g),w,h};};

// ---------- camera: one continuous move. Focused views rotate the dial so the focus points up and price reads upward. ----------
const FOC=(i,p,z,rotExtra)=>{const [x,y]=POS(i,p);return[z,x,y,-Math.PI/2-ang(i)+(rotExtra||0)];};
const KEYS=[[0.0,...FOC(101,21378,3.4)],[bar(2),...FOC(101,21392,3.0)],[bar(4),...FOC(113,21430,1.9)],[bar(5),1.04,0,0,0],[bar(6.5),1.06,0,0,-.09],[bar(8),...FOC(106,21425,1.55)],[bar(10),1.08,0,0,-.18],[T_WIN,1.1,0,0,-.18],
 [T_WIN+bar(.7),3.5,0,0,0],[bt(48),...FOC(101,21395,2.9)],[bt(53),...FOC(103,21400,3.0)],[bt(56.5),...FOC(106,21418,2.8)],[T_DROP,.84,0,0,0],[bt(63),...FOC(112,21470,2.3)],[T_TP,...FOC(128,21585,2.2)],[T_TP+.5,1.25,0,0,-3.2],
 [bt(74),...FOC(224,21535,2.6)],[bt(79),...FOC(228,21566,2.5)],[bar(20)+.2,1.5,0,0,-3.2],[bar(21.3),1.04,0,0,0],[D,1.04,0,0,.03]];
function cam(t){if(REDUCED){return{z:1.15,fx:0,fy:0,rot:0};}for(let k=1;k<KEYS.length;k++){if(t<=KEYS[k][0]){const a=KEYS[k-1],b=KEYS[k],u=sst(a[0],b[0],t);let r0=a[4],r1=b[4];while(r1-r0>Math.PI)r1-=TAU;while(r1-r0<-Math.PI)r1+=TAU;return{z:lerp(a[1],b[1],u),fx:lerp(a[2],b[2],u),fy:lerp(a[3],b[3],u),rot:lerp(r0,r1,u)};}}const l=KEYS[KEYS.length-1];return{z:l[1],fx:l[2],fy:l[3],rot:l[4]};}
function toScreen(t,x,y){const c=cam(t),dx=x-c.fx,dy=y-c.fy,co=Math.cos(c.rot),si=Math.sin(c.rot),s=SF*c.z;return[SCX+s*(dx*co-dy*si),SCY+s*(dx*si+dy*co)];}

// ---------- state helpers ----------
const headAt=t=>{ // live head (candle index) during the core plate; the full day otherwise
  const K2=[[T_WIN,94],[T_SWEEP,102],[T_CSD,104],[T_DISP+BEAT*.5,105],[T_FVG,106],[T_ARM,107.5],[T_DROP,108],[T_FILL,111],[T_TP,129.5],[T_TURN-.001,129.5],[T_TURN,216],[bt(73.5),221],[T_BSWEEP,225],[T_BCSD,227],[T_BMSS,228],[T_SKIP,230.5],[bar(20),232]];
  if(t<T_WIN-bar(.35))return N;if(t<T_WIN)return lerp(N,94,sst(T_WIN-bar(.35),T_WIN,t));if(t>=bar(20)){return lerp(232,N,sst(bar(20),bar(21.5),t));}
  for(let k=1;k<K2.length;k++)if(t<=K2[k][0]){const a=K2[k-1],b=K2[k];return lerp(a[1],b[1],(t-a[0])/Math.max(1e-6,b[0]-a[0]));}return 232;};
const handAt=t=>{const p=plateAt(t);if(p===0)return 101.5;if(p===1)return lerp(60,287,sst(bar(5),bar(11),t));if(p===2)return headAt(t);return lerp(headAt(bar(20)),101.5,sst(bar(20),bar(23),t));};
const activity=t=>{ // radial burst strength
  let a=.22+.25*energy(t);const ev=[T_SWEEP,T_CSD,T_MSS,T_FVG,T_FILL,T_BSWEEP,T_BMSS];for(const e of ev){const d=t-e;if(d>=0&&d<1.6)a+=.35*Math.exp(-d/.5);}
  const d=t-T_DROP;if(d>=0)a+=1.4*Math.exp(-d/1.3);if(t>=T_DROP-bar(.9)&&t<T_DROP)a+=.9*sst(T_DROP-bar(.9),T_DROP,t)*.5;return a;};

// ---------- drawing helpers ----------
function tx(s,x,y,sz,col,al,wt,fam,ls){ctx.font=`${wt||400} ${sz}px ${fam||MONO}`;ctx.fillStyle=col;ctx.textAlign=al||'left';ctx.textBaseline='alphabetic';if(ls&&ctx.letterSpacing!==undefined)ctx.letterSpacing=ls;ctx.fillText(s,x,y);if(ls&&ctx.letterSpacing!==undefined)ctx.letterSpacing='0px';}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const ring=(r,a0,a1)=>{ctx.beginPath();ctx.arc(0,0,r,a0===undefined?0:a0,a1===undefined?TAU:a1);};
function sector(i0,i1,r0,r1){ctx.beginPath();const a0=-Math.PI/2+i0*TAU/N,a1=-Math.PI/2+i1*TAU/N;ctx.arc(0,0,r1,a0,a1);ctx.arc(0,0,r0,a1,a0,true);ctx.closePath();}
const spr=c=>{const s=64,o=document.createElement('canvas');o.width=o.height=s;const g=o.getContext('2d'),r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,`rgba(${c},1)`);r.addColorStop(.25,`rgba(${c},.5)`);r.addColorStop(1,`rgba(${c},0)`);g.fillStyle=r;g.fillRect(0,0,s,s);return o;};
const SPR={GENERAL:spr('123,217,111'),LIVE:spr('229,98,90'),BACKTEST:spr('91,140,255'),RESEARCH:spr('169,139,255'),DATA:spr('47,207,154'),mint:spr('102,242,192')};
const glow=(k,x,y,r,a)=>{ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(SPR[k],x-r,y-r,2*r,2*r);ctx.globalAlpha=1;};

// ---------- the dial (design units, origin = dial centre) ----------
function dial(t){
  const c=cam(t),act=activity(t),head=headAt(t),hand=handAt(t),pl=plateAt(t),coreMode=pl===2;
  ctx.save();ctx.beginPath();ctx.rect(SC.x,SC.y,SC.w,SC.h);ctx.clip();
  ctx.translate(SCX,SCY);ctx.scale(SF*c.z,SF*c.z);ctx.rotate(c.rot);ctx.translate(-c.fx,-c.fy);
  const lw=1/(SF*c.z);                                            // keeps hairlines about one device pixel at any zoom
  ctx.lineWidth=lw;
  // streak burst: candle-wick style, green / red, grows with activity
  for(let i=0;i<1900;i++){const a=R(i,1)*TAU,r0=640+R(i,2)*8,L=18+Math.pow(R(i,3),2.0)*340*(.45+act*1.1),sh=.55+.45*Math.sin(TAU*(1+Math.floor(R(i,4)*3))*t/D*3+R(i,5)*TAU),up=R(i,6)<.52;
    ctx.strokeStyle=hexA(up?K.up:K.dn,clamp((.09+.34*R(i,7)*sh)*(.6+act*.7),0,.9));ctx.lineWidth=(R(i,8)<.1?2.2:1)*lw*1.3;ctx.beginPath();ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ctx.lineTo(Math.cos(a)*(r0+L),Math.sin(a)*(r0+L));ctx.stroke();}
  ctx.lineWidth=lw;
  // hairline structure: radial lines, rings, dashed rings
  ctx.strokeStyle=hexA(K.grid,.5);for(let d=0;d<72;d++){const a=d*TAU/72,r0=d%6===0?96:118;ctx.beginPath();ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ctx.lineTo(Math.cos(a)*(d%6===0?548:318),Math.sin(a)*(d%6===0?548:318));ctx.globalAlpha=d%6===0?.35:.12;ctx.stroke();}ctx.globalAlpha=1;
  [[96,.5,0],[142,.3,0],[190,.35,1],[240,.3,0],[290,.3,1],[316,.6,0],[540,.5,1],[548,.9,0]].forEach(([r,a,d])=>{ctx.strokeStyle=hexA(K.grid,a);ctx.setLineDash(d?[3*lw*4,5*lw*4]:[]);ring(r);ctx.stroke();});ctx.setLineDash([]);
  // price rings with labels along the 3 o'clock radius
  [[21380,'21,380 SSL'],[21400,'21,400'],[21430,'21,430 BSL'],[21500,'21,500'],[21596,'21,596 PDH'],[21690,'21,690']].forEach(([p,l])=>{const r=rad(p);ctx.strokeStyle=hexA(K.grid,.22);ring(r);ctx.stroke();tx(l,r+3,-2,7.5,K.dim);});
  // scale ring: ticks every 5 min, hour numbers, session arcs with 90-minute cycle marks (London and New York only)
  for(let i=0;i<N;i++){const a=ang(i)-TAU/N/2,hr=i%12===0,r0=548,r1=hr?562:552;ctx.strokeStyle=hexA(K.mu,hr?.7:.3);ctx.beginPath();ctx.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ctx.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.stroke();
    if(hr){ctx.save();ctx.rotate(a+Math.PI/2);tx(String((18+i/12)%24).padStart(2,'0'),0,-570,8,K.dim,'center');ctx.restore();}}
  const SES=[['ASIA',24,72,K.dim,0],['LDN',96,150,K.mint,3],['NY',156,210,K.mint,3]];
  SES.forEach(([nm,i0,i1,col,cyc])=>{const live=hand>=i0&&hand<i1;ctx.strokeStyle=hexA(col,live?.95:.45);ctx.lineWidth=(live?2.4:1.2)*lw;ring(580,-Math.PI/2+i0*TAU/N,-Math.PI/2+i1*TAU/N);ctx.stroke();ctx.lineWidth=lw;
    const am=-Math.PI/2+(i0+i1)/2*TAU/N;ctx.save();ctx.rotate(am+Math.PI/2);tx(nm+(cyc?'  3 × 90M':'  NO CYCLES'),0,-592,8.5,live?K.mint:K.dim,'center',700);ctx.restore();
    for(let k=0;k<=cyc;k++){const ii=i0+k*18,a=-Math.PI/2+ii*TAU/N;ctx.strokeStyle=hexA(col,.8);ctx.beginPath();ctx.moveTo(Math.cos(a)*574,Math.sin(a)*574);ctx.lineTo(Math.cos(a)*588,Math.sin(a)*588);ctx.stroke();
      if(k<cyc){const c1=live&&hand>=ii&&hand<ii+18;if(c1){ctx.fillStyle=hexA(K.mint,.18);sector(ii,ii+18,574,588);ctx.fill();}const am2=-Math.PI/2+(ii+9)*TAU/N;ctx.save();ctx.rotate(am2+Math.PI/2);tx('C'+(k+1),0,-562.5,7,c1?K.mint:K.dim,'center',c1?700:400);ctx.restore();}}});
  // segmented outer ring with dot-matrix cells
  for(let s=0;s<24;s++){const i0=s*12,a0=-Math.PI/2+i0*TAU/N+.004,a1=-Math.PI/2+(i0+12)*TAU/N-.004;ctx.strokeStyle=hexA(K.grid,.8);ring(610,a0,a1);ctx.stroke();ring(638,a0,a1);ctx.stroke();ctx.strokeStyle=hexA(K.grid,.45);ring(624,a0,a1);ctx.stroke();
    const tk=Math.floor(t*5+s);for(let cI=0;cI<8;cI++)for(let rI=0;rI<4;rI++){const aa=a0+(a1-a0)*(cI+.5)/8,rr_=614+rI*5.6,on=R(s*18+cI*3+rI,tk)<.38+.3*act;ctx.fillStyle=on?hexA(R(s,cI)<.12?K.mint:K.mu,.85):hexA(K.grid,.5);ctx.fillRect(Math.cos(aa)*rr_-1.2,Math.sin(aa)*rr_-1.2,2.4,2.4);}}
  // ink-level detail: segmented arcs, small labelled node markers on the inner rings, a drop shockwave
  [[150,.0,.9,3.2],[198,1.2,.6,2.4],[246,.4,.7,2.0]].forEach(([r,a0,len,w],k)=>{const rot=a0+t*(.04+k*.015)*(k%2?-1:1);ctx.strokeStyle=hexA(K.mint,.35);ctx.lineWidth=w*lw*3;ring(r,rot,rot+len);ctx.stroke();ctx.lineWidth=lw;ctx.strokeStyle=hexA(K.mu,.35);ring(r,rot+len+.15,rot+len+.15+len*.5);ctx.stroke();});
  for(let i=0;i<26;i++){const r=[142,190,240][i%3],a=R(i,41)*TAU+t*.02*((i%2)?-1:1),x=Math.cos(a)*r,y=Math.sin(a)*r;ctx.fillStyle=hexA(R(i,42)<.2?K.mint:K.mu,.8);ctx.fillRect(x-1.8,y-1.8,3.6,3.6);ctx.save();ctx.translate(x,y);ctx.rotate(-c.rot);tx(`n${String(i).padStart(2,'0')} ${(R(i,43)).toFixed(2)}`,5,2.5,5.6,hexA(K.dim,.9),'left');ctx.restore();}
  { const sd=t-T_DROP; if(sd>=0&&sd<1.3){const k=sd/1.3;ctx.strokeStyle=hexA(K.mint,(1-k)*.9);ctx.lineWidth=lw*(5*(1-k)+1);ring(100+k*620);ctx.stroke();ctx.strokeStyle=hexA(K.w,(1-k)*.5);ctx.lineWidth=lw*1.2;ring(100+k*480);ctx.stroke();ctx.lineWidth=lw;} }
  // candles
  const fut=coreMode?.1:1;
  for(let i=0;i<N;i++){const cd=C[i],a=ang(i),ca=Math.cos(a),sa=Math.sin(a),up=cd.c>=cd.o,col=up?K.up:K.dn,future=i>=head,al=future?(coreMode?.07:1):1;
    const rl=rad(cd.l),rh=rad(cd.h),ro=rad(cd.o),rc=rad(cd.c);ctx.globalAlpha=al;ctx.strokeStyle=col;ctx.lineWidth=lw*1.1;ctx.beginPath();ctx.moveTo(ca*rl,sa*rl);ctx.lineTo(ca*rh,sa*rh);ctx.stroke();
    ctx.lineWidth=Math.max(lw*2,TAU*rad(21400)/N*.5);ctx.beginPath();ctx.moveTo(ca*Math.min(ro,rc),sa*Math.min(ro,rc));ctx.lineTo(ca*Math.max(ro,rc)+ca*.8,sa*Math.max(ro,rc)+sa*.8);ctx.stroke();ctx.globalAlpha=1;}
  ctx.lineWidth=lw;
  // liquidity pools as resting orders: dashed level arc + stacked order ticks beyond the level
  const poolA=DT.ssl[0],poolB=DT.bsl[0],show1=sst(bar(2.4),bar(3.2),t);
  const orders=(pool,side,vis)=>{if(vis<=0)return;const r=rad(pool.level),col=side>0?K.dn:K.mint;ctx.globalAlpha=vis;ctx.strokeStyle=hexA(col,.9);ctx.lineWidth=lw*1.4;ctx.setLineDash([lw*6,lw*5]);ring(r,ang(pool.a)-.01,ang(pool.b+60>N?N-1:pool.b+60));ctx.stroke();ctx.setLineDash([]);
    const mid=(ang(pool.a)+ang(pool.b))/2;for(let k=0;k<14;k++){const a=ang(pool.a)+(ang(pool.b)-ang(pool.a))*k/13,off=(3+4*((k*7)%5))*(side>0?1:-1)*(1+.2*Math.sin(TAU*t*2+k));ctx.strokeStyle=hexA(col,.75);ctx.lineWidth=lw*2;ctx.beginPath();ctx.moveTo(Math.cos(a)*(r+side*3),Math.sin(a)*(r+side*3));ctx.lineTo(Math.cos(a)*(r+side*(3+Math.abs(off)*1.2)),Math.sin(a)*(r+side*(3+Math.abs(off)*1.2)));ctx.stroke();}
    ctx.globalAlpha=1;ctx.lineWidth=lw;};
  orders(poolA,-1,show1);orders(poolB,1,sst(bar(3.2),bar(4),t));
  // the sweep candle: ring, label, and the level it took (sweep = wick through + close back inside; run = closes through and keeps going)
  const sw=SA.sweep,swv=sst(.9,1.5,t)*(coreMode?(t>=T_SWEEP?1:0):1);
  if(swv>0&&!(pl===3&&false)){const [x,y]=POS(sw,SA.ext),[x2,y2]=POS(sw,C[sw].c);glow('mint',x,y,16+8*Math.sin(TAU*t*1.2),swv*.9);ctx.strokeStyle=hexA(K.mint,swv);ctx.lineWidth=lw*1.5;ring.call(null,0);ctx.beginPath();ctx.arc(x,y,7,0,TAU);ctx.stroke();ctx.lineWidth=lw;}

  const zv=coreMode?sst(T_FVG,T_FVG+.4,t):sst(bar(8),bar(8.8),t)+(pl===0?0:0)+(pl===3?1:0),zz=clamp(zv,0,1);

    CODE.forEach((l,i)=>{const lit=t>=times[i]&&t<T_TURN,turn=t>=T_TURN,y=r.y+38+i*rh;tx(String(i+1).padStart(2,'0'),r.x+10,y,8,K.grid);tx(l,r.x+28,y,8.2,turn&&i===0?hexA(K.dn,.95):(lit?(i>=5?K.mint:K.w):K.dim),'left',lit&&i>=5?700:400);if(lit&&Math.abs(t-times[i])<.5){ctx.fillStyle=K.mint;ctx.fillRect(r.x+4,y-8,2,10);}});if(t>=T_TURN)tx('f369_window → false · skip',r.x+10,r.y+r.h-8,8,K.dn,'left',700);}
  // 4 PD field: two heatmaps, premium (red) / discount (green)
  {const r=panelRect(3);frameBox(r,'PD FIELD','EQ '+P(SA.eq),K.dim);const cw=(r.w-30)/2;for(let m=0;m<2;m++){const x0=r.x+10+m*(cw+10);for(let i=0;i<8;i++)for(let j=0;j<6;j++){const v=.5+.5*Math.sin(i*.8+j*.9+t*1.6+m*2);const prem=j<3;ctx.fillStyle=hexA(prem?K.dn:K.up,.12+.5*v*(prem===(m===0)?1:.5));ctx.fillRect(x0+i*(cw/8),r.y+34+j*((r.h-60)/6),cw/8-1,(r.h-60)/6-1);}}tx('premium · sells',r.x+10,r.y+r.h-8,7.5,K.dn);tx('discount · buys',r.x+r.w-10,r.y+r.h-8,7.5,K.up,'right');}
  // 5 session routes: 90-minute cycles, 3 per session, none for Asia
  {const r=panelRect(4);frameBox(r,'SESSION ROUTES','NY TIME',K.dim);const hn=Math.floor(handAt(t)),w=SIM3.windowAt(hn),rows=[['ASIA','20:00-00:00','no cycles'],['LDN C1','02:00-03:30',''],['LDN C2','03:30-05:00',''],['LDN C3','05:00-06:30',''],['NY C1','07:00-08:30',''],['NY C2','08:30-10:00',''],['NY C3','10:00-11:30','']];const rh=(r.h-38)/rows.length;rows.forEach((x,i)=>{const act=w.ok&&((i>=1&&i<=3&&w.ses==='LDN'&&w.cyc===i)||(i>=4&&w.ses==='NY'&&w.cyc===i-3)),y=r.y+36+i*rh+rh*.6;ctx.fillStyle=act?K.mint:K.grid;ctx.beginPath();ctx.arc(r.x+14,y-3,3,0,TAU);ctx.fill();tx(x[0],r.x+24,y,8,act?K.w:K.mu,'left',act?700:400);tx(x[1],r.x+r.w-10,y,7.8,K.dim,'right');});}
  // 6 validation: waveforms and checks passed
  {const r=panelRect(5);frameBox(r,'VALIDATION','sample buffer',K.dim);for(let c=0;c<3;c++){ctx.strokeStyle=c===1?K.mint:hexA(K.mu,.8);ctx.lineWidth=1.2;ctx.beginPath();const y0=r.y+r.h*.35+c*(r.h*.17);for(let x=0;x<=r.w-20;x+=2){const ph=x/(r.w-20)*TAU*2.2+t*(2+c)+c*2,v=Math.sin(ph)*(r.h*.05)+Math.sin(ph*3.1)*(r.h*.02);x?ctx.lineTo(r.x+10+x,y0+v):ctx.moveTo(r.x+10,y0+v);}ctx.stroke();}const n=t>=T_TURN?9:PASS_A.filter(v=>t>=v).length;tx('checks passed',r.x+10,r.y+r.h-8,8,K.dim);tx(`${n} / 10`,r.x+r.w-10,r.y+r.h-8,10,t>=T_TURN?K.dn:K.mint,'right',700);}
  // 7 agents / dispatch
  {const r=panelRect(6);frameBox(r,'AGENTS / DISPATCH','5 WORKERS',K.dim);const AG=[['GENERAL','route',T_ARM],['DATA','scan feeds',T_WIN],['RESEARCH','pools · sweep',T_SWEEP],['BACKTEST','validate',T_CSD],['LIVE','place order',T_DROP]],rh=(r.h-40)/5;AG.forEach(([n,job,t0],i)=>{const y=r.y+36+i*rh,on=t>=t0&&t<t0+3,col=K.ag[n];ctx.fillStyle=col;ctx.beginPath();ctx.arc(r.x+16,y+rh*.4,4*(on?1+.5*pulse:1),0,TAU);ctx.fill();tx(n,r.x+28,y+rh*.55,8.6,on?K.w:K.mu,'left',700);tx(on?job.toUpperCase():'IDLE',r.x+r.w-10,y+rh*.55,7.8,on?col:K.dim,'right',700);ctx.fillStyle=K.line;ctx.fillRect(r.x+28,y+rh*.7,r.w-40,2);ctx.fillStyle=col;ctx.fillRect(r.x+28,y+rh*.7,(r.w-40)*(on?clamp((t-t0)/2.4,0,1):0),2);});}
  // 8 setup index: matrix of past setups, today's pick highlighted, the skip marked
  {const r=panelRect(7);frameBox(r,'SETUP INDEX','sim',K.dim);const cw=(r.w-20)/12,ch=(r.h-46)/6;for(let i=0;i<12;i++)for(let j=0;j<6;j++){const taken=R(i*7+j,2)<.3,pick=i===8&&j===2&&t>=T_DROP,skip=i===3&&j===4&&t>=T_SKIP;ctx.fillStyle=pick?K.mint:(skip?K.dn:hexA(taken?K.mu:K.grid,taken?.55:.35));ctx.fillRect(r.x+10+i*cw,r.y+34+j*ch,cw-1.5,ch-1.5);}tx('take',r.x+10,r.y+r.h-8,7.5,K.mint);tx('skip',r.x+r.w-10,r.y+r.h-8,7.5,K.dn,'right');}
  ctx.restore();}

function lowerRegion(t){const L=LY.lower,slide=H;const a=sst(T_WIN-.5,T_WIN+.2,t)*(1-sst(bar(20)-.2,bar(20)+.5,t));const dashOff=(1-a)*(LAYOUT==='16x9'?W:300);
  const led=1-a;if(led>0.001){const off=(LAYOUT==='16x9')?a*W:a*320;if(plateAt(t)===3)answerLower(t,0);else ledger(t,off*(plateAt(t)===2?1:0));}
  if(plateAt(t)===3)answerLower(t,(1-sst(bar(20)-.2,bar(20)+.5,t))*320*(LAYOUT==='16x9'?0:1));
  if(a>0.001)dashboard(t,dashOff);}

// ---------- end card ----------
function endCard(t){const v=sst(T_END,T_END+.6,t);if(v<=0)return;ctx.globalAlpha=v*.55;ctx.fillStyle=K.bg;ctx.fillRect(SC.x,SC.y,SC.w,SC.h);ctx.globalAlpha=v;const cx=SC.x+SC.w/2,cy=SC.y+SC.h/2;tx('F369.AI',cx,cy,LAYOUT==='16x9'?150:130,K.w,'center',200,LIGHT,'-3px');tx('The engine behind every answer.',cx,cy+58,LAYOUT==='16x9'?34:32,K.mu,'center',200,LIGHT);tx('F369 ENGINE · A SCHEMATIC OF EVERY ANSWER',cx,cy+100,11,K.mint,'center',700,MONO,'3px');ctx.globalAlpha=1;}


function overlays(t){const pl=plateAt(t);
  if(t>=T_TURN&&t<bar(20)){const v=sst(T_TURN,T_TURN+.5,t)*(1-sst(bar(20)-.3,bar(20),t)),x=SC.x+30,y=SC.y+28;ctx.globalAlpha=v;ctx.fillStyle='rgba(4,9,7,.9)';ctx.fillRect(x-10,y-14,LAYOUT==='16x9'?560:500,70);ctx.strokeStyle=K.line;ctx.strokeRect(x-9.5,y-13.5,LAYOUT==='16x9'?559:499,69);
    tx(`A  02:25 · LDN C1 · inside 90m cycle`,x,y+4,12,K.w,'left',700);tx('TAKEN ✓',x+(LAYOUT==='16x9'?540:480),y+4,12,K.mint,'right',700);
    tx(`B  12:40 · same sweep · no 90m cycle`,x,y+36,12,K.w,'left',700);tx(t>=T_SKIP?'SKIP ✗':'…',x+(LAYOUT==='16x9'?540:480),y+36,12,t>=T_SKIP?K.dn:K.dim,'right',700);ctx.globalAlpha=1;}
  if(pl===3&&t>=bar(20.4)&&t<T_END+.3){const v=sst(bar(20.4),bar(20.9),t)*(1-sst(T_END-.3,T_END+.3,t)),[sx,sy]=toScreen(t,...POS(SA.sweep,SA.ext)),bw=LAYOUT==='16x9'?420:380,bh=108,bx=clamp(sx-bw-60,SC.x+20,SC.x+SC.w-bw-20),by=clamp(sy-bh/2+120,SC.y+120,SC.y+SC.h-bh-20);ctx.globalAlpha=v;
    ctx.strokeStyle=hexA(K.mint,.8);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(bx+bw,by+bh/2);ctx.stroke();ctx.fillStyle='rgba(4,9,7,.94)';ctx.fillRect(bx,by,bw,bh);ctx.strokeRect(bx+.5,by+.5,bw-1,bh-1);ctx.fillStyle=hexA(K.mint,.9);ctx.fillRect(bx,by,bw,22);tx('THE WICK · LABELED CORRECTLY',bx+10,by+15,10,'#031008','left',700,MONO,'1px');
    [`SSL sweep · 02:25 · LDN C1`,`wick 9 pts through 21,380`,`close back inside = liquidity taken`,`then CSD, MSS, FVG in discount`].forEach((l,i)=>tx(l,bx+10,by+40+i*16,10.5,i===0?K.w:K.mu,'left',i===0?700:400));ctx.globalAlpha=1;}}
function frame(t){ctx.globalAlpha=1;ctx.fillStyle=K.bg;ctx.fillRect(0,0,W,H);
  dial(t);overlays(t);endCard(t);topbar(t);statement(t);lowerRegion(t);disclaimer();
  // fade out under the end card
  if(t>D-3.4){ctx.globalAlpha=sst(D-3.4,D-.15,t)*.9;ctx.fillStyle=K.bg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
window.TIMELINE={duration:D,fps:FPS,captions:STMT.map(s=>[s[0],s[1],[s[2]].concat(s[3])]),
  cues:{checks:PASS_A,p2:STEPS.map((_,i)=>P2_CHECK(i)),bars:[0,5,11,15,20].map(bar)},
  markers:{window:T_WIN,sweep:T_SWEEP,csd:T_CSD,mss:T_MSS,fvg:T_FVG,drop:T_DROP,fill:T_FILL,tp:T_TP,turn:T_TURN,skip:T_SKIP,end:T_END,plates:PLATES.map(p=>p[0])},math:MATH};
window.seek=t=>{frame(t);return true;};seek(+(q.get('t')||0));
if(q.get('play')==='1'){const t0=performance.now();(function l(){seek(((performance.now()-t0)/1000)%D);requestAnimationFrame(l);})();}
