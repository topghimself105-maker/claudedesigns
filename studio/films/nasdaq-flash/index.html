<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nasdaq Flash</title>
<style>html,body{margin:0;background:#05080a;height:100%}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script src="audio_map.js"></script>
<script>
// NASDAQ FLASH v2: 30 s, 60 fps, 4:5 (X) or 16:9 (YouTube). Real Nasdaq companies and facts, our own automations (frames of our own films), illustrative charts.
// Cut grid = the track tempo (156 bpm, beat 0.3846 s). Every cut lasts at least one beat (>= 0.38 s), so flashes are never closer than that.
// The track's second drop lands on beat 16 (6.15 s). ?layout=4x5|16x9  ?t=12 single frame.  Every frame is a pure function of t.
const q=new URLSearchParams(location.search),LAYOUT=q.get('layout')||'16x9',SIZES={'4x5':[1080,1350],'16x9':[1920,1080]},[W,H]=SIZES[LAYOUT],PORT=H>W;
const D=30,FPS=60,BPM=+(q.get('bpm')||156),BEAT=60/BPM,TAU=Math.PI*2,TOTALB=D/BEAT,ENDB=Math.round(TOTALB-8);
const cv=document.getElementById('c');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
const buf=document.createElement('canvas');buf.width=W;buf.height=H;const bx=buf.getContext('2d');
const C={bg:'#05080a',grid:'#12201f',line:'#16262a',mint:'#66f2c0',teal:'#19e6c1',red:'#ff4d57',w:'#f4fbf8',mu:'#7fa397',dim:'#40605a',up:'#19c29a',dn:'#ff4d57'};
const MONO='"DejaVu Sans Mono", monospace',SANS='"Inter", sans-serif',BLACK='"Inter Black","Inter",sans-serif';
const mod=(x,m)=>((x%m)+m)%m,clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,sst=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function hash(a,b){let x=(Math.imul(a|0,374761393)+Math.imul((b|0)+7919,668265263))|0;x=Math.imul(x^(x>>>13),1274126177);x^=x>>>16;return (x>>>0)/4294967296;}
const R=(a,b)=>hash(a,b),hashStr=s=>{let h=7;for(const c of s)h=(Math.imul(h,31)+c.charCodeAt(0))|0;return h;};
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;};
const K=PORT?W/1080:W/1920;                                   // scale for sizes designed at 1080 (portrait) / 1920 (landscape)

// ---------- real Nasdaq companies (IPO year = year the company listed on Nasdaq; verify before publishing) ----------
const CO=[['GOOGL','Google','Alphabet',2004],['META','Meta','Meta Platforms',2012],['AAPL','Apple','Apple',1980],['MSFT','Microsoft','Microsoft',1986],['AMZN','Amazon','Amazon',1997],['NVDA','NVIDIA','NVIDIA',1999],['TSLA','Tesla','Tesla',2010],['NFLX','Netflix','Netflix',2002]];
const TICKERS=[['NVDA','NVIDIA'],['AAPL','Apple'],['MSFT','Microsoft'],['AMZN','Amazon'],['GOOGL','Alphabet'],['META','Meta Platforms'],['TSLA','Tesla'],['AVGO','Broadcom'],['NFLX','Netflix'],['COST','Costco'],['AMD','Advanced Micro Devices'],['ADBE','Adobe'],['QCOM','Qualcomm'],['CSCO','Cisco']];
const AUTOS=[
 {k:'signal-to-fill',name:'SIGNAL TO FILL',desc:'signals · filter · risk gate · execute',files:['3','8','13','17','22','26','29']},
 {k:'ict-desk',name:'ICT DESK',desc:'killzone · sweep · MSS · FVG',files:['4','9','13','16','19','24','28']},
 {k:'night-desk',name:'NIGHT DESK',desc:'feeds · signals · candidates · executed',files:['3','9','14','18','20p8','23','25']},
 {k:'ship-line',name:'SHIP LINE',desc:'crew of agents, scout to shipper',files:['2','8','12','16','20','24','28']},
 {k:'f369-engine',name:'F369 ENGINE',desc:'rule chain · 90m cycle · CSD · MSS',files:['2','8','13','17','23p9','28p4','36p5','41']}];
const IMG={};
const loadAll=()=>Promise.all(AUTOS.flatMap(a=>a.files.map(f=>new Promise(res=>{const im=new Image();im.onload=()=>res();im.onerror=()=>res();im.src=`assets/${a.k}_${f}.jpg`;(IMG[a.k]=IMG[a.k]||[]).push(im);}))));
window.__ready=Promise.all([loadAll(),document.fonts.ready]);

// ---------- schedule (beats). Every cut >= 1 beat. ----------
const SCH=[];const add=(b0,b1,kind,p,o)=>SCH.push(Object.assign({t0:b0*BEAT,t1:b1*BEAT,kind,p:p||{},seed:SCH.length*17+3},o||{}));
let tk=0,au=0;const nextT=()=>TICKERS[tk++%TICKERS.length],nextA=()=>AUTOS[au++%AUTOS.length];
// build-up: the four lines, one per bar, right up to the drop
add(0,4,'fact',{lines:['OVER 70% OF TRADING',"ISN'T HUMAN ANYMORE."],bg:'tape'},{flash:1});
add(4,8,'fact',{lines:['A TRADE HAPPENS','FASTER THAN YOU BLINK.'],bg:'grid'},{flash:1});
add(8,12,'fact',{lines:['$300 MILLION SPENT','TO SAVE 0.006 SECONDS.'],bg:'ticket'},{flash:1});
add(12,16,'fact',{lines:['THEIR SERVERS LIVE','INSIDE THE STOCK EXCHANGE.'],bg:'chart'},{flash:1});
// the drop
add(16,18,'text',{w:'AUTOMATED.',bg:'burst'},{flash:1});
add(18,20,'nasdaq',{a:'NASDAQ',b:'FOUNDED 1971',c:'THE FIRST ELECTRONIC STOCK MARKET'},{flash:1});
add(20,22,'nasdaq',{a:'NASDAQ-100',b:'100 BIG COMPANIES',c:'NON-FINANCIAL · TECH-HEAVY'},{flash:1});
// company edits (Google, Meta, ...): name card, then its chart
let b=22;CO.forEach((co,i)=>{add(b,b+1.5,'company',{co},{flash:1});add(b+1.5,b+3,'chart',{t:[co[0],co[2]],ipo:co[3]},{flash:0});b+=3;});   // 22..46
add(46,48,'timeline',{},{flash:1});
add(48,51,'counter',{n:5,label:'AUTOMATIONS BUILT'},{flash:1});
for(let i=0;i<5;i++)add(51+i,52+i,'shot',{a:AUTOS[i]},{flash:i%2===0?1:0});               // 51..56
add(56,58,'text',{w:'RULES.',w2:'NOT GUESSES.',bg:'burst'},{flash:1});
const FILL=['tape','grid','ticket','chart','tape','grid','ticket','chart','tape','grid','ticket','chart'];
FILL.forEach((k,i)=>{const bb=58+i,p={};if(k==='chart')p.t=nextT();if(k==='ticket'){p.t=nextT();p.side=i%2?'SELL':'BUY';}add(bb,bb+1,k,p,{flash:0});});   // 58..70
add(ENDB,TOTALB,'end',{});
SCH.sort((a,b)=>a.t0-b.t0);
const cutAt=t=>{let lo=0,hi=SCH.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(SCH[m].t0<=t)lo=m;else hi=m-1;}return SCH[lo];};

// ---------- audio-driven energy ----------
const AM=window.AUDIO_MAP,amAt=(arr,t)=>{const x=clamp(t*10,0,arr.length-1.001),i=Math.floor(x);return lerp(arr[i],arr[i+1],x-i);};
const energy=t=>amAt(AM.low,t),bump=t=>Math.exp(-mod(t/BEAT,1)*7);

// ---------- helpers ----------
function tx(c,s,x,y,sz,col,al,wt,fam,ls){c.font=`${wt||400} ${sz}px ${fam||MONO}`;c.fillStyle=col;c.textAlign=al||'left';c.textBaseline='alphabetic';if(ls!==undefined&&c.letterSpacing!==undefined)c.letterSpacing=ls;c.fillText(s,x,y);if(c.letterSpacing!==undefined)c.letterSpacing='0px';}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
// draw one line with numbers/amounts highlighted in mint, auto-fitted to a max width
function hiLine(c,s,cx,y,maxSz,maxW,wt,fam,col,hi){fam=fam||BLACK;c.font=`${wt||800} 100px ${fam}`;let w100=c.measureText(s).width;const sz=Math.min(maxSz,100*maxW/Math.max(1,w100));c.font=`${wt||800} ${sz}px ${fam}`;
  const parts=s.split(/(\$?\d[\d,.]*%?)/).filter(Boolean);let w=0;parts.forEach(p=>w+=c.measureText(p).width);let x=cx-w/2;c.textAlign='left';c.textBaseline='alphabetic';
  parts.forEach(p=>{const isNum=/^\$?\d/.test(p);c.fillStyle=isNum&&hi!==false?C.mint:col;c.fillText(p,x,y);x+=c.measureText(p).width;});return sz;}
// illustrative candle series for a ticker (seeded, not real quotes)
const SERIES={};function series(sym,n=110){if(SERIES[sym])return SERIES[sym];const h=hashStr(sym),out=[];let p=100,tr=0;for(let i=0;i<n;i++){tr=tr*.92+(R(h,i*3)-.5)*.9;const vol=1.1+1.4*R(h,500+Math.floor(i/9)),o=p,c=o+tr*vol*1.6+(R(h,i*3+1)-.5)*vol*2,hh=Math.max(o,c)+R(h,i*3+2)*vol*1.8,l=Math.min(o,c)-R(h,i*3+7)*vol*1.8;out.push({o,h:hh,l,c,v:.3+R(h,i*5+2)+Math.abs(c-o)*.1});p=c;}SERIES[sym]=out;return out;}
function ma(S,k,i){let s=0,n=0;for(let j=Math.max(0,i-k+1);j<=i;j++){s+=S[j].c;n++;}return s/n;}

function chart(c,x,y,w,h,sym,name,u,seed,mini,ipo){
  c.fillStyle='#0b1013';c.fillRect(x,y,w,h);
  const S=series(sym),cnt=mini?34:48,n=Math.floor(lerp(mini?30:46,S.length,clamp(u,0,1))),from=Math.max(0,n-(mini?40:56)),view=S.slice(from,n);
  const top=mini?34:(PORT?200:130),bot=mini?26:(PORT?190:150),L=x+(mini?8:(PORT?70:60)),T=y+top,Rr=x+w-(mini?8:(PORT?120:130)),B=y+h-bot;
  let lo=1e9,hi=-1e9;view.forEach(k=>{lo=Math.min(lo,k.l);hi=Math.max(hi,k.h);});const pad=(hi-lo)*.12;lo-=pad;hi+=pad;const cw=(Rr-L)/Math.max(view.length,cnt),px=i=>L+cw*(i+.5),py=v=>T+(B-T)*(1-(v-lo)/(hi-lo));
  c.strokeStyle=C.grid;c.lineWidth=1;for(let g=0;g<=6;g++){const gy=T+(B-T)*g/6;c.beginPath();c.moveTo(L,gy);c.lineTo(Rr,gy);c.stroke();}for(let g=0;g<=10;g++){const gx=L+(Rr-L)*g/10;c.beginPath();c.moveTo(gx,T);c.lineTo(gx,B);c.stroke();}
  view.forEach((k,i)=>{c.fillStyle=k.c>=k.o?'rgba(25,194,154,.28)':'rgba(255,77,87,.28)';const vh=(k.v/1.6)*(B-T)*.16;c.fillRect(px(i)-cw*.34,B-vh,cw*.68,vh);});
  view.forEach((k,i)=>{const up=k.c>=k.o,col=up?C.up:C.dn;c.strokeStyle=col;c.lineWidth=Math.max(1,cw*.12);c.beginPath();c.moveTo(px(i),py(k.h));c.lineTo(px(i),py(k.l));c.stroke();c.fillStyle=col;c.fillRect(px(i)-cw*.34,py(Math.max(k.o,k.c)),cw*.68,Math.max(1.5,Math.abs(py(k.o)-py(k.c))));});
  c.strokeStyle='#ffd166';c.lineWidth=mini?1.5:2.4;c.beginPath();view.forEach((k,i)=>{const m=ma(S,20,from+i);i?c.lineTo(px(i),py(m)):c.moveTo(px(i),py(m));});c.stroke();
  const last=view[view.length-1];
  if(!mini){c.fillStyle=last.c>=last.o?C.up:C.dn;const tw=PORT?100:118;c.fillRect(Rr+6,py(last.c)-16,tw,32);tx(c,last.c.toFixed(1),Rr+14,py(last.c)+7,PORT?19:22,'#031210','left',700);
    c.strokeStyle=hexA(C.mint,.6);c.setLineDash([8,8]);c.beginPath();c.moveTo(L,py(last.c));c.lineTo(Rr,py(last.c));c.stroke();c.setLineDash([]);
    const ai=Math.floor(view.length*.55+R(seed,4)*view.length*.25),ak=view[ai];c.fillStyle=C.mint;c.beginPath();c.moveTo(px(ai),py(ak.l)+16);c.lineTo(px(ai)-12,py(ak.l)+38);c.lineTo(px(ai)+12,py(ak.l)+38);c.fill();tx(c,'ALERT',px(ai),py(ak.l)+64,18,C.mint,'center',700);
    for(let g=0;g<=6;g++){const v=hi-(hi-lo)*g/6;tx(c,v.toFixed(0),Rr+14,T+(B-T)*g/6+5,PORT?14:16,C.dim,'left');}
    tx(c,sym,x+(PORT?40:64),y+(PORT?92:78),PORT?84:62,C.w,'left',800,BLACK,'-1px');tx(c,name.toUpperCase()+'  ·  1D  ·  NASDAQ'+(ipo?'  ·  IPO '+ipo:''),x+(PORT?40:64),y+(PORT?132:110),PORT?19:20,C.mu,'left',400);
    const bx0=x+w-(PORT?330:560);['1m','5m','1H','1D','1W'].forEach((tf,i)=>{rr(c,bx0+i*(PORT?62:62),y+(PORT?150:34),54,34,6);c.fillStyle=tf==='1D'?'rgba(102,242,192,.18)':'rgba(255,255,255,.05)';c.fill();tx(c,tf,bx0+27+i*62,y+(PORT?173:57),17,tf==='1D'?C.mint:C.mu,'center',700);});
    rr(c,x+w-210,y+(PORT?36:34),190,34,6);c.strokeStyle=hexA(C.mint,.6);c.lineWidth=1.5;c.stroke();tx(c,'ILLUSTRATIVE',x+w-115,y+(PORT?59:57),16,C.mint,'center',700,MONO,'1px');
    tx(c,'indexed to 100 · simulated',L,y+h-(PORT?120:110),16,C.dim,'left');}
  else{tx(c,sym,x+12,y+26,22,C.w,'left',800,BLACK);tx(c,'1D',x+w-12,y+24,14,C.mu,'right');}
  c.strokeStyle=C.line;c.lineWidth=2;c.strokeRect(x+1,y+1,w-2,h-2);}

// ---------- scenes ----------
function gridBg(c,a){c.strokeStyle=hexA(C.mint,a||.07);c.lineWidth=1;for(let i=0;i<W/48+1;i++){c.beginPath();c.moveTo(i*48,0);c.lineTo(i*48,H);c.stroke();}for(let i=0;i<H/48+1;i++){c.beginPath();c.moveTo(0,i*48);c.lineTo(W,i*48);c.stroke();}}
function sceneChart(c,cut,u,t){const [sym,name]=cut.p.t;chart(c,0,0,W,H,sym,name,u*1.05+.25,cut.seed,false,cut.p.ipo);const cxp=lerp(.2,.9,u)*W,cyp=H*(.35+.3*R(cut.seed,9));c.strokeStyle='rgba(255,255,255,.25)';c.lineWidth=1.5;c.setLineDash([6,8]);c.beginPath();c.moveTo(cxp,PORT?200:130);c.lineTo(cxp,H-150);c.moveTo(60,cyp);c.lineTo(W-120,cyp);c.stroke();c.setLineDash([]);}
function sceneTicket(c,cut,u,t){c.fillStyle='#050809';c.fillRect(0,0,W,H);gridBg(c,.1);const [sym,name]=cut.p.t||TICKERS[0],sell=cut.p.side==='SELL',col=sell?C.red:C.teal,bw=Math.min(1180,W-120),bh=PORT?230:190,gap=PORT?(H-3*bh)/4:(H-3*bh)/4;
  for(let k=0;k<3;k++){const pop=sst(k*.12,k*.12+.22,u),y=gap+k*(bh+gap),x=lerp(W,(W-bw)/2,pop);c.save();c.globalAlpha=pop;rr(c,x,y,bw,bh,18);c.fillStyle='rgba(8,14,16,.96)';c.fill();c.strokeStyle=col;c.lineWidth=3;c.stroke();
    const tagW=PORT?200:230;c.fillStyle=col;c.fillRect(x,y,tagW,bh);tx(c,k===1?'STP':(sell?'SELL':'BUY'),x+tagW/2,y+bh/2+22,PORT?56:64,'#04120f','center',800,BLACK);
    const T2=k===0?[sym,name]:TICKERS[(hashStr(sym)+k*3)%TICKERS.length];tx(c,T2[0],x+tagW+36,y+(PORT?100:86),PORT?84:78,C.w,'left',800,BLACK,'-2px');tx(c,(k===1?'STOP ORDER':'LIMIT ORDER')+(PORT?'':'  ·  SENT BY AUTOMATION'),x+tagW+38,y+(PORT?160:142),PORT?24:26,C.mu,'left',400);
    tx(c,k===2?'RISK 0.5%':'FILLED',x+bw-30,y+bh-26,PORT?32:44,col,'right',700,MONO);c.restore();}}
function sceneTape(c,cut,u,t){c.fillStyle='#04080a';c.fillRect(0,0,W,H);const rows=PORT?9:7,rh=H/rows;for(let r=0;r<rows;r++){const dir=r%2?1:-1,off=(t*(260+r*40)*K*dir)%1400;c.save();c.globalAlpha=.9;let x=-1400+off;for(let k=0;k<16;k++){const T2=TICKERS[(k+r*3)%TICKERS.length];tx(c,T2[0],x,r*rh+rh*.72,rh*.62,(k+r)%3===0?C.mint:(r%2?'rgba(255,255,255,.18)':'rgba(255,255,255,.55)'),'left',800,BLACK,'-1px');x+=c.measureText(T2[0]).width+70;}c.restore();}c.fillStyle='rgba(4,8,10,.72)';c.fillRect(0,0,W,H);}
function sceneGrid(c,cut,u,t){c.fillStyle='#04080a';c.fillRect(0,0,W,H);const cols=PORT?2:3,rows=PORT?3:2,cw=W/cols,ch=H/rows;for(let i=0;i<cols*rows;i++){const T2=TICKERS[(cut.seed+i*2)%TICKERS.length];chart(c,(i%cols)*cw+6,Math.floor(i/cols)*ch+6,cw-12,ch-12,T2[0],T2[1],u*1.3+.3,cut.seed+i,true);}}
function sceneShot(c,cut,u,t){const a=cut.p.a,imgs=IMG[a.k],im=imgs[Math.floor(R(cut.seed,2)*imgs.length)];c.fillStyle='#030607';c.fillRect(0,0,W,H);if(!im||!im.width)return;
  const asp=W/H,z=lerp(1.0,1.25,u)*(1+R(cut.seed,3)*1.1),sw=Math.min(im.width,im.height*asp)/z,sh=sw/asp,ax=R(cut.seed,4),ay=R(cut.seed,5),sx=(im.width-sw)*lerp(ax,clamp(ax+.12,0,1),u),sy=(im.height-sh)*lerp(ay,clamp(ay-.1,0,1),u);c.drawImage(im,sx,sy,sw,sh,0,0,W,H);
  c.fillStyle='rgba(2,8,8,.35)';c.fillRect(0,0,W,H);const gh=PORT?420:300,g=c.createLinearGradient(0,H-gh,0,H);g.addColorStop(0,'rgba(2,8,8,0)');g.addColorStop(1,'rgba(2,8,8,.92)');c.fillStyle=g;c.fillRect(0,H-gh,W,gh);
  const ts=Math.min(92,(W-120)/(a.name.length*.62));tx(c,a.name,PORT?56:70,H-(PORT?200:150),ts,C.w,'left',800,BLACK,'-2px');tx(c,a.desc.toUpperCase(),PORT?60:74,H-(PORT?150:100),PORT?20:26,C.mint,'left',700,MONO,'2px');tx(c,'OUR AUTOMATION',PORT?60:W-70,H-(PORT?100:100),PORT?20:22,C.mu,PORT?'left':'right',700,MONO,'3px');
  c.strokeStyle=hexA(C.mint,.55);c.lineWidth=3;c.strokeRect(28,28,W-56,H-56);}
function sceneText(c,cut,u,t){c.fillStyle='#04080a';c.fillRect(0,0,W,H);if(cut.p.bg==='tape'){sceneTape(c,cut,u,t);}else{for(let i=0;i<120;i++){const a=R(cut.seed,i)*TAU,L=lerp(200,1500,R(cut.seed,i+300))*(.4+u),r0=120;c.strokeStyle=hexA(i%3?C.mint:C.red,.18+.3*R(cut.seed,i+700));c.lineWidth=R(cut.seed,i+900)<.1?3:1.2;c.beginPath();c.moveTo(W/2+Math.cos(a)*r0,H/2+Math.sin(a)*r0*.6);c.lineTo(W/2+Math.cos(a)*L,H/2+Math.sin(a)*L*.6);c.stroke();}}
  const sc=1+.1*Math.exp(-u*8);c.save();c.translate(W/2,H/2);c.scale(sc,sc);const lines=[cut.p.w].concat(cut.p.w2?[cut.p.w2]:[]);lines.forEach((l,i)=>{c.font=`800 100px ${BLACK}`;const sz=Math.min(PORT?210:260,100*(W*.86)/c.measureText(l).width);tx(c,l,0,(i-(lines.length-1)/2)*sz*.98+sz*.34,sz,i?C.mint:C.w,'center',800,BLACK,'-6px');});c.restore();}
// the four lines of the build-up and other fact cards: two big lines, numbers highlighted, background by type
function sceneFact(c,cut,u,t){const bg=cut.p.bg;if(bg==='tape')sceneTape(c,cut,u,t);else if(bg==='grid'){sceneGrid(c,cut,u,t);c.fillStyle='rgba(4,8,10,.74)';c.fillRect(0,0,W,H);}else if(bg==='ticket'){sceneTicket(c,{p:{t:TICKERS[7],side:'BUY'},seed:cut.seed},u,t);c.fillStyle='rgba(4,8,10,.78)';c.fillRect(0,0,W,H);}else{sceneChart(c,{p:{t:TICKERS[0]},seed:cut.seed},u,t);c.fillStyle='rgba(4,8,10,.78)';c.fillRect(0,0,W,H);}
  const sc=1+.06*Math.exp(-mod(u*4,1)*6),lines=cut.p.lines,band=PORT?560:440;c.fillStyle='rgba(2,6,8,.78)';c.fillRect(0,H/2-band/2,W,band);c.strokeStyle=hexA(C.mint,.6);c.lineWidth=3;c.beginPath();c.moveTo(0,H/2-band/2);c.lineTo(W,H/2-band/2);c.moveTo(0,H/2+band/2);c.lineTo(W,H/2+band/2);c.stroke();
  c.save();c.translate(W/2,H/2);c.scale(sc,sc);const sz=lines.map(l=>{c.font=`800 100px ${BLACK}`;return Math.min(PORT?118:150,100*(W*.9)/c.measureText(l).width);});const m=Math.min(...sz);lines.forEach((l,i)=>hiLine(c,l,0,(i-(lines.length-1)/2)*m*1.12+m*.36,m,W*.9,800,BLACK,i?C.mint:C.w,true));c.restore();
  const reveal=sst(0,.25,u);c.fillStyle=C.mint;c.fillRect(0,H/2+band/2+14,W*reveal*u,8);}

// ---------- frame: scene -> buffer -> post (punch, chromatic split, glitch slices, flash, scanlines, vignette) ----------
function frame(t){const cut=cutAt(t),u=clamp((t-cut.t0)/(cut.t1-cut.t0),0,1),lt=t-cut.t0,en=energy(t);
  bx.globalAlpha=1;bx.setTransform(1,0,0,1,0,0);bx.clearRect(0,0,W,H);SCENES[cut.kind](bx,cut,u,t);
  const punch=1+(cut.kind==='end'?0:.04)*bump(t)*(.4+en),fl=cut.flash?Math.exp(-lt*22)*.7:0,dropFl=t>=BEAT*16?Math.exp(-(t-BEAT*16)*9):0;

  const g=lt<.14?(1-lt/.14):0,ab=(3+14*g+6*bump(t)*en)*K*(cut.kind==='end'?.3:1);ctx.drawImage(buf,0,0);
  ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.2+.22*g;ctx.filter='sepia(1) saturate(6) hue-rotate(-50deg)';ctx.drawImage(buf,ab,0);ctx.filter='sepia(1) saturate(6) hue-rotate(110deg)';ctx.drawImage(buf,-ab,0);ctx.filter='none';ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  if(g>0){const ns=5+Math.floor(8*g);for(let k=0;k<ns;k++){const fr=Math.floor(t*60),sy=R(fr,k)*H,sh=8+R(fr,k+50)*60,dx=(R(fr,k+100)-.5)*(60+220*g)*K;ctx.drawImage(buf,0,sy,W,sh,dx,sy,W,sh);}}

  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.5)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const f=Math.max(fl,dropFl*.9);if(f>0){ctx.globalAlpha=clamp(f,0,1);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
