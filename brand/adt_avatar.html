<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#05080a}canvas{display:block}</style></head><body><canvas id="c" width="1000" height="1000"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1000,TAU=Math.PI*2,mint='#66f2c0';
function h(a,b){let v=(Math.imul(a|0,374761393)+Math.imul((b|0)+7919,668265263))|0;v=Math.imul(v^(v>>>13),1274126177);v^=v>>>16;return (v>>>0)/4294967296;}
document.fonts.ready.then(()=>{
x.fillStyle='#05080a';x.fillRect(0,0,W,W);
// soft glow
let g=x.createRadialGradient(500,500,0,500,500,480);g.addColorStop(0,'rgba(102,242,192,.20)');g.addColorStop(.6,'rgba(102,242,192,.05)');g.addColorStop(1,'rgba(102,242,192,0)');x.fillStyle=g;x.fillRect(0,0,W,W);
// sphere of information: dust inside disc
const R=330;for(let i=0;i<1500;i++){const r=R*Math.sqrt(h(1,i)),a=h(2,i)*TAU;x.fillStyle=`rgba(235,255,248,${.12+.4*h(3,i)})`;const s=h(4,i)<.06?3:1.6;x.fillRect(500+Math.cos(a)*r,500+Math.sin(a)*r,s,s);}
// wireframe globe
x.strokeStyle='rgba(102,242,192,.28)';x.lineWidth=2;x.beginPath();x.arc(500,500,R,0,TAU);x.stroke();
x.strokeStyle='rgba(102,242,192,.13)';[.38,.72].forEach(k=>{x.beginPath();x.ellipse(500,500,R*k,R,0,0,TAU);x.stroke();});for(let l=-1;l<=1;l++){x.beginPath();x.ellipse(500,500+l*R*.5,R*Math.sqrt(1-.25*l*l),R*.12,0,0,TAU);x.stroke();}
// route + spider node on the rim, path to a filled-order node
x.strokeStyle='rgba(244,251,248,.55)';x.lineWidth=2.5;x.setLineDash([2,10]);x.beginPath();x.arc(500,500,R+54,Math.PI*.15,Math.PI*1.65);x.stroke();x.setLineDash([]);
const a0=Math.PI*1.65,px=500+Math.cos(a0)*(R+54),py=500+Math.sin(a0)*(R+54);x.fillStyle=mint;x.beginPath();x.arc(px,py,13,0,TAU);x.fill();x.strokeStyle='rgba(102,242,192,.5)';x.lineWidth=3;x.beginPath();x.arc(px,py,26,0,TAU);x.stroke();
for(let i=0;i<7;i++){const a=Math.PI*(.15+1.5*(i+.5)/7.5),X=500+Math.cos(a)*(R+54),Y=500+Math.sin(a)*(R+54);x.fillStyle='#f4fbf8';x.fillRect(X-4,Y-4,8,8);}
// backing plate for the letters
x.fillStyle='rgba(5,8,10,.62)';x.fillRect(150,380,700,240);
// ADT
x.font='900 250px "Inter Black","Inter",sans-serif';x.textAlign='center';x.textBaseline='alphabetic';if(x.letterSpacing!==undefined)x.letterSpacing='-10px';
const wA=x.measureText('AD').width,wT=x.measureText('T').width,gap=-4,tot=wA+gap+wT,x0=500-tot/2;x.textAlign='left';x.fillStyle='#f4fbf8';x.fillText('AD',x0,598);x.fillStyle=mint;x.fillText('T',x0+wA+gap,598);if(x.letterSpacing!==undefined)x.letterSpacing='0px';
window.done=true;});
</script></body></html>
