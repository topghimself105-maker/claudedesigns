<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111}canvas{display:block}</style></head><body><canvas id="c" width="1000" height="1000"></canvas><script>
// Fine-line wire marks, ADT only, symbols for AI + trading. ?v=28..35
const v=+(new URLSearchParams(location.search).get('v')||28),c=document.getElementById('c'),x=c.getContext('2d'),W=1000,TAU=Math.PI*2,INK='#141414',T='#D97757',SANS='Inter,sans-serif';
function bg(){const g=x.createLinearGradient(0,0,W,W);g.addColorStop(0,'#F1F1F2');g.addColorStop(1,'#D9D9DB');x.fillStyle=g;x.fillRect(0,0,W,W);}
function wire(lw){x.strokeStyle=INK;x.lineWidth=lw||4;x.lineCap='round';x.lineJoin='round';x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=7;x.shadowOffsetY=7;}
const line=(a,b,c2,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c2,d);x.stroke();},arc=(cx,cy,r,a0,a1)=>{x.beginPath();x.arc(cx,cy,r,a0,a1);x.stroke();};
function node(px,py,r){x.save();x.fillStyle='#EDEDEE';x.beginPath();x.arc(px,py,r,0,TAU);x.fill();x.stroke();x.restore();}
function name(txt,px,py,size,ls,al){x.save();x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=5;x.shadowOffsetY=5;x.font=`200 ${size}px ${SANS}`;x.fillStyle=INK;x.textAlign=al||'center';x.textBaseline='alphabetic';if(x.letterSpacing!==undefined)x.letterSpacing=ls+'px';x.fillText(txt,px+(al?0:ls/2),py);x.restore();if(x.letterSpacing!==undefined)x.letterSpacing='0px';}
document.fonts.load('200 100px Inter').then(()=>document.fonts.ready).then(()=>{bg();wire();
if(v===28){ // neural net -> candle output
 const L=[[220,[300,470,640]],[400,[240,400,560,720]],[580,[300,470,640]]],out=[780,470];arc(500,470,370,0,TAU);
 for(let i=0;i<2;i++)L[i][1].forEach(a=>L[i+1][1].forEach(b=>line(L[i][0],a,L[i+1][0],b)));L[2][1].forEach(a=>line(580,a,out[0],out[1]));
 L.forEach(l=>l[1].forEach(y=>node(l[0],y,17)));node(out[0],out[1],30);line(out[0],out[1]+12,out[0],out[1]-12);line(out[0]-9,out[1]-3,out[0],out[1]-12);line(out[0]+9,out[1]-3,out[0],out[1]-12);name('ADT',500,890,120,60);}
if(v===29){ // globe + chart line
 arc(500,470,340,0,TAU);for(const k of [.35,.7])arc(500,470,340,0,0),x.beginPath(),x.ellipse(500,470,340*k,340,0,0,TAU),x.stroke();for(const l of [-.5,0,.5]){x.beginPath();x.ellipse(500,470+l*340,340*Math.sqrt(1-l*l),340*.1,0,0,TAU);x.stroke();}
 const p=[[190,620],[290,570],[360,600],[450,500],[540,520],[640,400],[720,430],[810,320]];x.save();x.lineWidth=7;x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.stroke();x.restore();node(810,320,14);name('ADT',500,900,120,60);}
if(v===30){ // row of thin candles in a circle
 arc(500,480,350,0,TAU);const C=[[270,560,70,'d'],[340,520,90,'u'],[410,540,60,'d'],[480,470,100,'u'],[550,430,80,'u'],[620,400,110,'u'],[690,340,90,'u']];
 C.forEach(([cx,cy,h2,t])=>{line(cx,cy-h2*.9,cx,cy+h2*.9);x.save();x.fillStyle=t==='u'?'#EDEDEE':INK;x.beginPath();x.rect(cx-17,cy-h2*.45,34,h2*.9);x.fill();x.stroke();x.restore();});line(150,700,850,700);name('ADT',500,900,120,60);}
if(v===31){ // depth chart (bids / asks)
 line(500,120,500,820);const bid=[],ask=[];for(let i=0;i<=8;i++){bid.push([500-i*50,520-Math.pow(i/8,1.3)*330]);ask.push([500+i*50,520-Math.pow(i/8,1.3)*300]);}
 [bid,ask].forEach(a=>{x.beginPath();a.forEach((p,i)=>{if(i){x.lineTo(p[0],a[i-1][1]);x.lineTo(p[0],p[1]);}else x.moveTo(p[0],p[1]);});x.stroke();});line(100,520,900,520);arc(500,470,370,0,TAU);name('ADT',500,640,140,40);}
if(v===32){ // geometric spider: crawler
 arc(500,470,350,0,TAU);for(const s of [-1,1])for(let i=0;i<4;i++){const y0=410+i*34,kx=500+s*(120+i*20),ky=y0-130+i*25,ex=500+s*(250+i*18),ey=y0+130-i*12;x.beginPath();x.moveTo(500+s*30,y0);x.lineTo(kx,ky);x.lineTo(ex,ey);x.stroke();node(ex,ey,7);}
 x.beginPath();x.ellipse(500,470,46,80,0,0,TAU);x.fillStyle='#EDEDEE';x.fill();x.stroke();x.beginPath();x.ellipse(500,372,26,30,0,0,TAU);x.fill();x.stroke();line(500,430,520,470);line(520,470,500,510);line(500,510,480,470);line(480,470,500,430);name('ADT',500,900,120,60);}
if(v===33){ // chip with candle inside
 x.beginPath();x.rect(260,230,480,480);x.stroke();x.beginPath();x.rect(330,300,340,340);x.stroke();for(let i=0;i<5;i++){const t=330+i*70;line(t+20,230,t+20,180);line(t+20,710,t+20,760);line(260,t+20,210,t+20);line(740,t+20,790,t+20);}
 line(500,350,500,590);x.beginPath();x.rect(455,410,90,120);x.stroke();line(260,470,330,470);line(670,470,740,470);name('ADT',500,890,120,60);}
if(v===34){ // hexagon network + rising line
 const H=[];for(let i=0;i<6;i++){const a=-Math.PI/2+i*TAU/6;H.push([500+Math.cos(a)*350,470+Math.sin(a)*350]);}x.beginPath();H.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.stroke();
 for(let i=0;i<6;i++)line(H[i][0],H[i][1],H[(i+2)%6][0],H[(i+2)%6][1]);H.forEach(p=>node(p[0],p[1],15));
 x.save();x.lineWidth=7;x.beginPath();x.moveTo(330,610);x.lineTo(430,560);x.lineTo(500,590);x.lineTo(640,420);x.stroke();x.restore();node(640,420,13);name('ADT',500,900,120,60);}
if(v===35){ // constellation up-arrow
 const P=[[500,170],[500,330],[500,490],[500,650],[350,330],[650,330],[250,430],[750,430]];line(500,170,500,650);line(500,170,350,330);line(500,170,650,330);line(350,330,250,430);line(650,330,750,430);arc(500,470,370,0,TAU);P.forEach(p=>node(p[0],p[1],14));line(130,700,870,700);name('ADT',500,900,120,60);}
window.done=true;});
</script></body></html>
