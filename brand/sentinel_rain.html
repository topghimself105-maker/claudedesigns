<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
// The Sentinel, code-rain finals. ?v=1|2|3 &m=avatar|banner
const Q=new URLSearchParams(location.search),v=+(Q.get('v')||1),m=Q.get('m')||'avatar',[W,H]=m==='avatar'?[1000,1000]:[1500,500],c=document.getElementById('c');c.width=W;c.height=H;const x=c.getContext('2d'),TAU=Math.PI*2;
function R(a,b){let q=(Math.imul(a|0,374761393)+Math.imul((b|0)+7919,668265263))|0;q=Math.imul(q^(q>>>13),1274126177);q^=q>>>16;return (q>>>0)/4294967296;}
const GL='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワ0123456789',JP='IPAGothic,monospace',MONO='"DejaVu Sans Mono",monospace',SERIF='"Bitstream Charter",serif',SANS='Inter,sans-serif';
const HEAD='#DFFFEF',GRN='#1FDB8A',DEEP='#01140F';
function T(s,px,py,sz,wt,fam,col,ls,glow){x.save();x.font=`${wt} ${sz}px ${fam}`;x.fillStyle=col;x.textAlign='center';x.textBaseline='alphabetic';if(x.letterSpacing!==undefined)x.letterSpacing=(ls||0)+'px';if(glow){x.shadowColor=glow;x.shadowBlur=sz*.4;}x.fillText(s,px+(ls||0)/2,py);x.restore();}
function bg(){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#000D09');g.addColorStop(1,'#03261C');x.fillStyle=g;x.fillRect(0,0,W,H);}
function glyph(ch,px,py,fs,col,glow){x.font=`bold ${fs}px ${JP}`;x.textAlign='center';x.fillStyle=col;if(glow){x.shadowColor='rgba(120,255,190,.95)';x.shadowBlur=16;}x.fillText(ch,px,py);x.shadowBlur=0;}
function rain(cols,fs,seed,dim){for(let k=0;k<cols;k++){const px=(k+.5)*W/cols,len=7+Math.floor(R(seed+1,k)*15),head=R(seed+2,k)*(H+fs*len*.6),fz=fs*(.8+.45*R(seed+4,k));for(let j=0;j<len;j++){const py=head-j*fz;if(py<-fz||py>H+fz)continue;const a=(j===0?1:Math.pow(1-j/len,1.4)*.85)*(dim||1);glyph(GL[Math.floor(R(seed+3,k*97+j)*GL.length)],px,py,fz,j===0?`rgba(223,255,239,${a})`:`rgba(31,219,138,${a})`,j===0);}}}
function vign(a){const g=x.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,0,W,H);}
// glyph mosaic: text drawn as a grid of glyphs (bright inside the letters)
function mosaic(txt,font,cx,cy,cell,seed){const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');g.font=font;g.textAlign='center';g.textBaseline='middle';g.fillStyle="#1FDB8A";if(g.letterSpacing!==undefined)g.letterSpacing=(Q.get('ls')||0)+'px';g.fillText(txt,cx,cy);const d=g.getImageData(0,0,W,H).data;x.save();x.globalAlpha=.16;x.shadowColor='rgba(31,219,138,1)';x.shadowBlur=40;x.drawImage(o,0,0);x.restore();x.save();x.globalCompositeOperation='source-atop';x.restore();
 for(let yy=cell/2;yy<H;yy+=cell)for(let xx=cell/2;xx<W;xx+=cell){const a=d[((yy|0)*W+(xx|0))*4+3];if(a>100){const ch=GL[Math.floor(R(seed,xx*7+yy)*GL.length)];glyph(ch,xx,yy+cell*.38,cell*1.05,R(seed+1,xx+yy*3)<.18?HEAD:GRN,false);}}}
function v1(){bg();if(m==='avatar'){rain(13,56,40);x.fillStyle='rgba(0,13,9,.72)';x.beginPath();x.arc(500,500,300,0,TAU);x.fill();x.strokeStyle='rgba(31,219,138,.85)';x.lineWidth=3;x.beginPath();x.arc(500,500,300,0,TAU);x.stroke();for(let i=0;i<60;i++){const a=i/60*TAU;x.strokeStyle='rgba(31,219,138,.55)';x.lineWidth=i%5?1.5:3;x.beginPath();x.moveTo(500+Math.cos(a)*(i%5?314:308),500+Math.sin(a)*(i%5?314:308));x.lineTo(500+Math.cos(a)*326,500+Math.sin(a)*326);x.stroke();}T('S',500,640,400,400,SERIF,HEAD,0,'rgba(31,219,138,.85)');}
 else{rain(34,34,50);const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(0,13,9,.25)');g.addColorStop(.37,'rgba(0,13,9,.88)');g.addColorStop(.72,'rgba(0,13,9,.25)');x.fillStyle=g;x.fillRect(0,0,W,H);T('SENTINEL',560,280,110,700,MONO,HEAD,22,'rgba(31,219,138,.8)');T('The market is code. Read it.',560,340,24,400,MONO,GRN,2);}vign(.55);}
function eyeRain(cx,cy,s){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='rgba(0,13,9,.85)';x.beginPath();x.arc(0,0,300,0,TAU);x.fill();
 for(let i=0;i<150;i++){const a=i/150*TAU,r0=95+R(5,i)*15,r1=170+R(6,i)*100,col=R(7,i)<.15?HEAD:GRN;x.strokeStyle=col;x.globalAlpha=.35+.6*R(8,i);x.lineWidth=1.5+R(9,i)*2.5;x.beginPath();x.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);x.lineTo(Math.cos(a)*r1,Math.sin(a)*r1);x.stroke();}x.globalAlpha=1;
 x.strokeStyle='rgba(31,219,138,.85)';x.lineWidth=3;x.beginPath();x.arc(0,0,300,0,TAU);x.stroke();x.save();x.shadowColor='rgba(31,219,138,.9)';x.shadowBlur=30;x.fillStyle='#000D09';x.beginPath();x.arc(0,0,92,0,TAU);x.fill();x.strokeStyle=GRN;x.lineWidth=5;x.stroke();x.restore();
 for(let j=0;j<5;j++)glyph(GL[(j*7)%GL.length],0,-46+j*26,24,`rgba(223,255,239,${1-j*.18})`,j===0);x.restore();}
function v2(){bg();if(m==='avatar'){rain(13,56,60);eyeRain(500,500,1.05);}else{rain(34,34,70,.7);const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(0,13,9,.3)');g.addColorStop(.35,'rgba(0,13,9,.85)');g.addColorStop(.6,'rgba(0,13,9,.3)');x.fillStyle=g;x.fillRect(0,0,W,H);eyeRain(1180,250,.62);T('SENTINEL',530,275,100,300,SANS,HEAD,26,'rgba(31,219,138,.7)');T('Always watching the market.',530,335,24,400,MONO,GRN,2);}vign(.5);}
function v3(){bg();if(m==='avatar'){rain(16,48,80,.25);mosaic('S',`900 760px ${SANS}`,500,520,15,90);}else{rain(40,30,100,.22);mosaic('SENTINEL',`900 190px ${SANS}`,620,215,9,110);T('THE MARKET IS CODE. READ IT.',620,380,22,700,MONO,GRN,8);}vign(.55);}

function plate(r){x.fillStyle='rgba(0,13,9,.78)';x.beginPath();x.arc(500,500,r,0,TAU);x.fill();}
function banner(name,font,ls,tag,tagFont,seed){rain(30,36,seed);const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(0,13,9,.3)');g.addColorStop(.37,'rgba(0,13,9,.9)');g.addColorStop(.72,'rgba(0,13,9,.3)');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();x.font=font;x.fillStyle=HEAD;x.textAlign='center';if(x.letterSpacing!==undefined)x.letterSpacing=ls+'px';x.shadowColor='rgba(31,219,138,.8)';x.shadowBlur=40;x.fillText(name,560+ls/2,280);x.restore();T(tag,560,340,22,400,tagFont,GRN,3);}
// 4: mono S, double ring with a gap + order dot
function v4(){bg();if(m==='avatar'){rain(11,64,140);plate(300);x.strokeStyle=GRN;x.lineWidth=4;x.beginPath();x.arc(500,500,300,-Math.PI*.32,Math.PI*1.62);x.stroke();x.strokeStyle='rgba(31,219,138,.45)';x.lineWidth=2;x.beginPath();x.arc(500,500,276,0,TAU);x.stroke();
 x.save();x.shadowColor='rgba(120,255,190,1)';x.shadowBlur=24;x.fillStyle=HEAD;x.beginPath();x.arc(500+Math.cos(-Math.PI*.4)*300,500+Math.sin(-Math.PI*.4)*300,16,0,TAU);x.fill();x.restore();T('S',500,640,400,700,MONO,HEAD,0,'rgba(31,219,138,.85)');}
 else banner('SENTINEL',`700 104px ${MONO}`,20,'The market is code. Read it.',MONO,150);vign(.55);}
// 5: thin S (same family as the wordmark) in a radar ring with sweep
function v5(){bg();if(m==='avatar'){rain(13,56,160);plate(310);const sw=x.createConicGradient(-Math.PI*.5,500,500);sw.addColorStop(0,'rgba(31,219,138,0)');sw.addColorStop(.85,'rgba(31,219,138,0)');sw.addColorStop(.999,'rgba(31,219,138,.35)');sw.addColorStop(1,'rgba(31,219,138,0)');x.fillStyle=sw;x.beginPath();x.arc(500,500,310,0,TAU);x.fill();
 [310,232].forEach((r,i)=>{x.strokeStyle=i?'rgba(31,219,138,.35)':GRN;x.lineWidth=i?1.5:3;x.beginPath();x.arc(500,500,r,0,TAU);x.stroke();});for(let i=0;i<4;i++){const a=i*Math.PI/2;x.strokeStyle=GRN;x.lineWidth=3;x.beginPath();x.moveTo(500+Math.cos(a)*310,500+Math.sin(a)*310);x.lineTo(500+Math.cos(a)*340,500+Math.sin(a)*340);x.stroke();}
 T('S',500,630,380,200,SANS,HEAD,0,'rgba(31,219,138,.9)');}
 else banner('SENTINEL',`200 112px ${SANS}`,30,'Always watching the market.',MONO,170);vign(.55);}
// 6: serif S in a hexagon frame, heavier rain
function v6(){bg();if(m==='avatar'){rain(9,78,180);x.fillStyle='rgba(0,13,9,.8)';x.beginPath();for(let i=0;i<6;i++){const a=-Math.PI/2+i*TAU/6;x.lineTo(500+Math.cos(a)*320,500+Math.sin(a)*320);}x.closePath();x.fill();x.strokeStyle=GRN;x.lineWidth=4;x.stroke();
 x.strokeStyle='rgba(31,219,138,.4)';x.lineWidth=2;x.beginPath();for(let i=0;i<6;i++){const a=-Math.PI/2+i*TAU/6;x.lineTo(500+Math.cos(a)*292,500+Math.sin(a)*292);}x.closePath();x.stroke();T('S',500,640,400,400,SERIF,HEAD,0,'rgba(31,219,138,.85)');}
 else banner('SENTINEL',`400 108px ${SERIF}`,24,'The market is code. Read it.',MONO,190);vign(.55);}

document.fonts.load('bold 40px IPAGothic').then(()=>document.fonts.load('900 100px Inter')).then(()=>document.fonts.ready).then(()=>{[0,v1,v2,v3,v4,v5,v6][v]();window.done=true;});
</script></body></html>
