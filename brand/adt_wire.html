<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111}canvas{display:block}</style></head><body><canvas id="c" width="1000" height="1000"></canvas><script>
// Fine-line "wire" marks: golden-ratio geometry with the name built in. ?v=22..27
const v=+(new URLSearchParams(location.search).get('v')||22),c=document.getElementById('c'),x=c.getContext('2d'),W=1000,TAU=Math.PI*2,PHI=(1+Math.sqrt(5))/2;
const INK='#141414',LIGHT='#E8E8E9',CR='#F4F1EA',T='#D97757',DK='#1B1916';
const SANS='Inter,sans-serif';
function bgLight(){const g=x.createLinearGradient(0,0,W,W);g.addColorStop(0,'#F1F1F2');g.addColorStop(1,'#D9D9DB');x.fillStyle=g;x.fillRect(0,0,W,W);}
function bgDark(){const g=x.createRadialGradient(500,420,50,500,500,700);g.addColorStop(0,'#2A2622');g.addColorStop(1,'#141210');x.fillStyle=g;x.fillRect(0,0,W,W);}
function wire(col,lw,dark){x.strokeStyle=col;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';x.shadowColor=dark?'rgba(0,0,0,.6)':'rgba(0,0,0,.28)';x.shadowBlur=dark?10:7;x.shadowOffsetY=dark?6:7;}
function line(a,b,c2,d){x.beginPath();x.moveTo(a,b);x.lineTo(c2,d);x.stroke();}
function arc(cx,cy,r,a0,a1){x.beginPath();x.arc(cx,cy,r,a0,a1);x.stroke();}
function name(txt,px,py,size,col,ls,al){x.save();x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=5;x.shadowOffsetY=5;x.font=`200 ${size}px ${SANS}`;x.fillStyle=col;x.textAlign=al||'left';x.textBaseline='alphabetic';if(x.letterSpacing!==undefined)x.letterSpacing=ls+'px';x.fillText(txt,px,py);x.restore();if(x.letterSpacing!==undefined)x.letterSpacing='0px';}
function spiral(cx,cy,r0,th0,th1,rot){x.beginPath();for(let i=0;i<=400;i++){const th=th0+(th1-th0)*i/400,r=r0*Math.pow(PHI,2*th/Math.PI),px=cx+Math.cos(th+rot)*r,py=cy+Math.sin(th+rot)*r;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();}
document.fonts.load('200 100px Inter').then(()=>document.fonts.ready).then(()=>{
if(v===22){bgLight();wire(INK,4);// golden circle, spiral, name on the horizontal
 arc(500,470,350,Math.PI*.5,Math.PI*1.5,true);arc(500,470,350,-Math.PI*.5,Math.PI*.5);line(500,120,500,820);line(110,600,890,600);
 spiral(640,600,330,-2.6*TAU,0.05,-Math.PI/2);arc(640,600,180,0,TAU);arc(640,600,90,0,TAU);line(640,420,640,780);
 name('ADT',140,592,200,INK,24);}
if(v===23){bgLight();wire(INK,4);// chart line through a circle
 arc(500,480,340,0,TAU);line(160,480,840,480);const pts=[[160,700],[240,650],[300,690],[380,590],[450,610],[540,500],[610,530],[700,400],[770,430],[840,320]];x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();pts.forEach(p=>{x.beginPath();x.arc(p[0],p[1],7,0,TAU);x.fillStyle=LIGHT;x.fill();x.stroke();});
 line(500,140,500,820);name('ADT',500,900,120,INK,60,'center');}
if(v===24){bgLight();wire(INK,4);// arches on a vertical axis, name crossing
 line(430,120,430,860);[90,150,240,390].forEach(r=>arc(430,490,r,-Math.PI/2,Math.PI/2));line(120,490,880,490);arc(430,490,390,Math.PI/2,Math.PI*1.5);
 name('ADT',110,478,170,INK,14);name('ALGO · DATA · TRADING',452,552,22,INK,7,'left');}
if(v===25){bgLight();wire(INK,4);// triangle + incircle + name on the crossbar
 const A=[500,130],B=[860,790],C=[140,790];x.beginPath();x.moveTo(...A);x.lineTo(...B);x.lineTo(...C);x.closePath();x.stroke();
 const a=Math.hypot(B[0]-C[0],B[1]-C[1]),b=Math.hypot(A[0]-C[0],A[1]-C[1]),cc=Math.hypot(A[0]-B[0],A[1]-B[1]),p=a+b+cc,ix=(a*A[0]+b*B[0]+cc*C[0])/p,iy=(a*A[1]+b*B[1]+cc*C[1])/p,ir=Math.abs((B[0]-A[0])*(A[1]-C[1])-(A[0]-C[0])*(B[1]-A[1]))/p;arc(ix,iy,ir,0,TAU);arc(ix,iy,ir/PHI,0,TAU);
 line(250,590,750,590);line(500,130,500,790);name('ADT',500,566,130,INK,22,'center');}
if(v===26){bgDark();wire(CR,3.5,true);// candle outline in a circle, order line
 arc(500,500,350,0,TAU);arc(500,500,350/PHI,0,TAU);line(500,170,500,830);x.beginPath();x.rect(430,360,140,250);x.stroke();line(120,455,880,455);
 x.strokeStyle=T;x.lineWidth=4;line(120,455,430,455);name('FILLR',500,900,96,CR,40,'center');}
if(v===27){bgDark();wire(CR,3.5,true);// vesica: two overlapping circles, centre line, order dot
 arc(400,470,250,0,TAU);arc(600,470,250,0,TAU);arc(500,470,350,0,TAU);line(500,120,500,820);line(110,470,890,470);
 x.shadowBlur=0;x.fillStyle=T;x.beginPath();x.arc(500,470,12,0,TAU);x.fill();wire(CR,3.5,true);name('KYRO',500,910,100,CR,46,'center');}
window.done=true;});
</script></body></html>
