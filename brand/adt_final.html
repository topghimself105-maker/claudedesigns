<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
// ADT final brand set: globe + rising line, fine-line wire. ?m=avatar|banner|card|wide
const m=new URLSearchParams(location.search).get('m')||'avatar',S={avatar:[1000,1000],banner:[1500,500],banner2:[1500,500],banner3:[1500,500],card:[1080,1350],wide:[1920,1080]}[m],[W,H]=S,c=document.getElementById('c');c.width=W;c.height=H;const x=c.getContext('2d'),TAU=Math.PI*2,INK='#141414',SANS='Inter,sans-serif';
function bg(){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#F1F1F2');g.addColorStop(1,'#D9D9DB');x.fillStyle=g;x.fillRect(0,0,W,H);}
function wire(lw,sh){x.strokeStyle=INK;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=sh;x.shadowOffsetY=sh;}
function txt(t,px,py,size,ls,al,wt){x.save();x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=5;x.shadowOffsetY=5;x.font=`${wt||200} ${size}px ${SANS}`;x.fillStyle=INK;x.textAlign=al||'center';x.textBaseline='alphabetic';if(x.letterSpacing!==undefined)x.letterSpacing=ls+'px';x.fillText(t,px+(al==='center'||!al?ls/2:0),py);x.restore();if(x.letterSpacing!==undefined)x.letterSpacing='0px';}
function globe(cx,cy,R,lw,line){wire(lw,Math.max(4,R/45));x.beginPath();x.arc(cx,cy,R,0,TAU);x.stroke();for(const k of [.35,.7]){x.beginPath();x.ellipse(cx,cy,R*k,R,0,0,TAU);x.stroke();}for(const l of [-.5,0,.5]){x.beginPath();x.ellipse(cx,cy+l*R,R*Math.sqrt(1-l*l),R*.1,0,0,TAU);x.stroke();}
 if(line){const P=[[-.82,.42],[-.56,.3],[-.38,.37],[-.15,.12],[.06,.17],[.38,-.12],[.58,-.06],[.78,-.28]].map(p=>[cx+p[0]*R,cy+p[1]*R]);x.save();x.lineWidth=lw*1.9;x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.restore();const q=P[P.length-1];x.save();x.fillStyle='#EDEDEE';x.beginPath();x.arc(q[0],q[1],R*.05,0,TAU);x.fill();x.stroke();x.restore();}}
document.fonts.load('200 100px Inter').then(()=>document.fonts.load('600 40px Inter')).then(()=>document.fonts.ready).then(()=>{bg();
if(m==='avatar'){globe(500,430,330,6.5,true);txt('ADT',500,890,150,52);}
if(m==='banner'){globe(1190,250,185,4,true);txt('ADT',560,285,190,50,'center');txt('TRADING AUTOMATION, EXPLAINED',560,345,26,12,'center',300);txt('DATA IN  ·  ORDER OUT',560,410,20,9,'center',300);}
if(m==='banner'){} 
if(m==='banner2'){x.fillStyle='#161412';x.fillRect(0,0,W,H);const g=x.createRadialGradient(1100,250,20,1100,250,700);g.addColorStop(0,'#2A2622');g.addColorStop(1,'#141210');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.save();const I=x.strokeStyle;x.strokeStyle='#F4F1EA';x.fillStyle='#F4F1EA';x.lineWidth=3.5;x.lineCap='round';x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=9;x.shadowOffsetY=6;const cx=1190,cy=250,R=185;x.beginPath();x.arc(cx,cy,R,0,TAU);x.stroke();for(const k of [.35,.7]){x.beginPath();x.ellipse(cx,cy,R*k,R,0,0,TAU);x.stroke();}for(const l of [-.5,0,.5]){x.beginPath();x.ellipse(cx,cy+l*R,R*Math.sqrt(1-l*l),R*.1,0,0,TAU);x.stroke();}
 x.strokeStyle='#D97757';x.lineWidth=7;x.beginPath();[[-.82,.42],[-.56,.3],[-.38,.37],[-.15,.12],[.06,.17],[.38,-.12],[.58,-.06],[.78,-.28]].forEach((p,i)=>i?x.lineTo(cx+p[0]*R,cy+p[1]*R):x.moveTo(cx+p[0]*R,cy+p[1]*R));x.stroke();x.restore();
 x.save();x.fillStyle='#F4F1EA';x.textAlign='center';x.font='200 190px Inter,sans-serif';if(x.letterSpacing!==undefined)x.letterSpacing='50px';x.fillText('ADT',585,285);x.font='300 26px Inter,sans-serif';if(x.letterSpacing!==undefined)x.letterSpacing='12px';x.fillText('TRADING AUTOMATION, EXPLAINED',570,345);x.fillStyle='#D97757';x.font='300 20px Inter,sans-serif';if(x.letterSpacing!==undefined)x.letterSpacing='9px';x.fillText('DATA IN  ·  ORDER OUT',570,405);x.restore();}
if(m==='banner3'){wire(4,6);const P=[[500,380],[570,350],[640,372],[720,300],[800,318],[890,240],[960,255],[1060,170],[1140,185],[1250,90],[1330,110],[1430,40]];x.save();x.lineWidth=7;x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.restore();const q=P[P.length-1];x.save();x.fillStyle='#EDEDEE';x.beginPath();x.arc(q[0],q[1],12,0,TAU);x.fill();x.stroke();x.restore();
 x.beginPath();x.moveTo(500,440);x.lineTo(1450,440);x.stroke();txt('ADT',290,285,190,50,'center');txt('TRADING AUTOMATION, EXPLAINED',290,345,19,5,'center',300);txt('ALGO · DATA · TRADING',290,405,19,10,'center',300);}
if(m==='card'){globe(540,470,330,5.5,true);txt('ADT',540,990,210,60);txt('ALGO · DATA · TRADING',540,1070,34,18,'center',300);x.save();x.font=`400 20px ${SANS}`;x.fillStyle='#4a4a4a';x.textAlign='center';x.fillText('Not financial advice. For educational purposes only. Simulated data.',540,1290);x.restore();}
if(m==='wide'){globe(520,540,330,5.5,true);txt('ADT',1230,590,260,70,'center');txt('ALGO · DATA · TRADING',1230,670,38,20,'center',300);x.save();x.font=`400 22px ${SANS}`;x.fillStyle='#4a4a4a';x.textAlign='center';x.fillText('Not financial advice. For educational purposes only. Simulated data.',960,1040);x.restore();}
window.done=true;});
</script></body></html>
