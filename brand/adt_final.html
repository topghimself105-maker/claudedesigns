<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#111}canvas{display:block}</style></head><body><canvas id="c"></canvas><script>
// ADT final brand set: globe + rising line, fine-line wire. ?m=avatar|banner|card|wide
const QP=new URLSearchParams(location.search),NAME=QP.get('name')||'SENTINEL',m=QP.get('m')||'avatar',S={avatar:[1000,1000],banner:[1500,500],banner2:[1500,500],banner3:[1500,500],card:[1080,1350],wide:[1920,1080]}[m],[W,H]=S,c=document.getElementById('c');c.width=W;c.height=H;const x=c.getContext('2d'),TAU=Math.PI*2,INK='#141414',SANS='Inter,sans-serif';
function bg(){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#F1F1F2');g.addColorStop(1,'#D9D9DB');x.fillStyle=g;x.fillRect(0,0,W,H);}
function wire(lw,sh){x.strokeStyle=INK;x.lineWidth=lw;x.lineCap='round';x.lineJoin='round';x.shadowColor='rgba(0,0,0,.28)';x.shadowBlur=sh;x.shadowOffsetY=sh;}
function txt(t,px,py,size,ls,al,wt){x.save();x.shadowColor='rgba(0,0,0,.25)';x.shadowBlur=5;x.shadowOffsetY=5;x.font=`${wt||200} ${size}px ${SANS}`;x.fillStyle=INK;x.textAlign=al||'center';x.textBaseline='alphabetic';if(x.letterSpacing!==undefined)x.letterSpacing=ls+'px';x.fillText(t,px+(al==='center'||!al?ls/2:0),py);x.restore();if(x.letterSpacing!==undefined)x.letterSpacing='0px';}
function fit(size,ls,maxW){x.font=`200 ${size}px ${SANS}`;if(x.letterSpacing!==undefined)x.letterSpacing=ls+'px';const w=x.measureText(NAME).width;if(x.letterSpacing!==undefined)x.letterSpacing='0px';const k=Math.min(1,maxW/w);return [size*k,ls*k];}
function nm(cx,y,size,ls,maxW,al){const [f,l]=fit(size,ls,maxW);txt(NAME,cx,y,f,l,al);}
function globe(cx,cy,R,lw,line){wire(lw,Math.max(4,R/45));x.beginPath();x.arc(cx,cy,R,0,TAU);x.stroke();for(const k of [.35,.7]){x.beginPath();x.ellipse(cx,cy,R*k,R,0,0,TAU);x.stroke();}for(const l of [-.5,0,.5]){x.beginPath();x.ellipse(cx,cy+l*R,R*Math.sqrt(1-l*l),R*.1,0,0,TAU);x.stroke();}
 if(line){const P=[[-.82,.42],[-.56,.3],[-.38,.37],[-.15,.12],[.06,.17],[.38,-.12],[.58,-.06],[.78,-.28]].map(p=>[cx+p[0]*R,cy+p[1]*R]);x.save();x.lineWidth=lw*1.9;x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.restore();const q=P[P.length-1];x.save();x.fillStyle='#EDEDEE';x.beginPath();x.arc(q[0],q[1],R*.05,0,TAU);x.fill();x.stroke();x.restore();}}

if(m==='banner'){}

 x.save();const I=x.strokeStyle;x.strokeStyle='#F4F1EA';x.fillStyle='#F4F1EA';x.lineWidth=3.5;x.lineCap='round';x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=9;x.shadowOffsetY=6;const cx=1190,cy=250,R=185;x.beginPath();x.arc(cx,cy,R,0,TAU);x.stroke();for(const k of [.35,.7]){x.beginPath();x.ellipse(cx,cy,R*k,R,0,0,TAU);x.stroke();}for(const l of [-.5,0,.5]){x.beginPath();x.ellipse(cx,cy+l*R,R*Math.sqrt(1-l*l),R*.1,0,0,TAU);x.stroke();}
 x.strokeStyle='#D97757';x.lineWidth=7;x.beginPath();[[-.82,.42],[-.56,.3],[-.38,.37],[-.15,.12],[.06,.17],[.38,-.12],[.58,-.06],[.78,-.28]].forEach((p,i)=>i?x.lineTo(cx+p[0]*R,cy+p[1]*R):x.moveTo(cx+p[0]*R,cy+p[1]*R));x.stroke();x.restore();
 x.save();x.fillStyle='#F4F1EA';x.textAlign='center';{const [f,l]=fit(190,50,700);x.font=`200 ${f}px Inter,sans-serif`;if(x.letterSpacing!==undefined)x.letterSpacing=l+'px';x.fillText(NAME,585+l/2,285);}x.font='300 26px Inter,sans-serif';if(x.letterSpacing!==undefined)x.letterSpacing='12px';x.fillText('TRADING AUTOMATION, EXPLAINED',570,345);x.fillStyle='#D97757';x.font='300 20px Inter,sans-serif';if(x.letterSpacing!==undefined)x.letterSpacing='9px';x.fillText('DATA IN  ·  ORDER OUT',570,405);x.restore();}
if(m==='banner3'){wire(4,6);const P0=[[500,380],[570,350],[640,372],[720,300],[800,318],[890,240],[960,255],[1060,170],[1140,185],[1250,90],[1330,110],[1430,40]],P=P0.map(p=>[700+(p[0]-500)*.8,p[1]]);x.save();x.lineWidth=7;x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.restore();const q=P[P.length-1];x.save();x.fillStyle='#EDEDEE';x.beginPath();x.arc(q[0],q[1],12,0,TAU);x.fill();x.stroke();x.restore();
 x.beginPath();x.moveTo(700,440);x.lineTo(1450,440);x.stroke();nm(400,235,170,46,560,'center');txt('TRADING AUTOMATION, EXPLAINED',400,290,18,5,'center',300);txt('DATA IN  ·  ORDER OUT',400,340,18,9,'center',300);}

if(m==='wide'){globe(520,540,330,5.5,true);nm(1290,590,230,60,620,'center');txt('TRADING AUTOMATION, EXPLAINED',1290,660,26,9,'center',300);x.save();x.font=`400 22px ${SANS}`;x.fillStyle='#4a4a4a';x.textAlign='center';x.fillText('Not financial advice. For educational purposes only. Simulated data.',960,1040);x.restore();}
window.done=true;});
</script></body></html>
